      const allEntries = getPanditPayoutEntries();
      const eligible = allEntries.filter(b => !b.isCancelled);
      const cancelledCompensations = allEntries.filter(b => b.isCancelled);
      const pending = eligible.filter(b => !b.isPaid);
      const paid = eligible.filter(b => b.isPaid);
      const adminTransfers = eligible.filter(b => b.paymentType !== 'pandit_gives_admin_fee');
      const panditGivesAdminFees = eligible.filter(b => b.paymentType === 'pandit_gives_admin_fee');
      const pendingCompensations = cancelledCompensations.filter(b => b.panditCompensationStatus !== 'Paid');

      let list = PANDIT_PAYOUT_FILTER === 'pending' ? pending :
                 PANDIT_PAYOUT_FILTER === 'paid' ? paid :
                 PANDIT_PAYOUT_FILTER === 'admin_transfer' ? adminTransfers :
                 PANDIT_PAYOUT_FILTER === 'pandit_gives_admin_fee' ? panditGivesAdminFees :
                 PANDIT_PAYOUT_FILTER === 'compensations' ? cancelledCompensations :
                 allEntries;

      if (PANDIT_PAYOUT_SEARCH) {
        const q = PANDIT_PAYOUT_SEARCH.toLowerCase();
        list = list.filter(b => 
          (b.bookingId || '').toLowerCase().includes(q) ||
          (b.userName || '').toLowerCase().includes(q) ||
          (b.userEmail || '').toLowerCase().includes(q) ||
          (b.phone || '').toLowerCase().includes(q) ||
          (b.panditName || '').toLowerCase().includes(q) ||
          (b.panditEmail || '').toLowerCase().includes(q) ||
          (b.targetPanditEmail || '').toLowerCase().includes(q) ||
          (b.service || '').toLowerCase().includes(q) ||
          (b.pujaName || '').toLowerCase().includes(q)
        );

              <p class="muted" style="margin:4px 0 0;font-size:12.5px">Platform commission split, other fees deduction, multi-day payouts, and dual payment types (Admin transfer to Pandit &amp; Pandit gives Admin fee)</p>

            </div>

            <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px">
              <div>
                <div style="display:flex;align-items:center;gap:8px">
                  <span class="material-icons" style="color:var(--admin-gold);font-size:24px">tune</span>
                  <h3 style="margin:0;font-size:16.5px;color:var(--admin-dark)">Platform Commission &amp; Dakshina Split Settings</h3>
                </div>
                <p style="margin:4px 0 0;font-size:12.5px;color:#6b5244;line-height:1.5">
                  Set the Admin platform fee % once. The Admin platform charge and any other fee are deducted from the ceremony amount, and the net Dakshina is transferred to the Pandit account (or collected from the Pandit if paid directly).
                </p>
              </div>
              <div style="display:flex;align-items:center;gap:10px;background:#fff;border:1.5px solid #d99a19;border-radius:10px;padding:8px 16px;box-shadow:0 2px 8px rgba(0,0,0,0.04)">
                <span class="muted" style="font-size:12.5px;font-weight:600">Active Commission:</span>
                <b style="font-size:22px;color:var(--admin-gold)">${currentPct}%</b>
              </div>
            </div>

            <div style="display:grid;grid-template-columns:repeat(auto-fit, minmax(290px, 1fr));gap:18px;margin-top:16px;padding-top:16px;border-top:1px dashed #ebd9c2;align-items:center">

    // Admin updates platform commission % once and updates all payments

      const input = document.getElementById('global-commission-input');

      if (!input) return;
      const newPct = Math.max(0, Math.min(100, Number(input.value) || 0));

      if (btn) {
        btn.disabled = true;
        btn.innerHTML = '<span class="material-icons spin" style="font-size:16px">sync</span> Updating All Payments...';
      }

      try {
        const res = await api('/platform-commission', {
          method: 'PUT',
          body: { percent: newPct, commissionPercent: newPct }
        });
        const savedPercent = res.percent !== undefined ? res.percent : newPct;
        S.commissionPercent = savedPercent;
        toast(`Platform commission set to ${savedPercent}%! All pending puja payments updated. 🙏`);
        await loadData();
      } catch (e) {
        toast(e.message || 'Failed to update commission percentage', true);
        if (btn) {
          btn.disabled = false;
          btn.innerHTML = '<span class="material-icons" style="font-size:16px">check_circle</span> Save &amp; Apply % to All Payments';
        }
      }

    // Print all Pandit Payout records full-width in landscape with zero cut-off
    window.printPanditPayoutsReport = function() {
      const allEntries = getPanditPayoutEntries();
      const eligible = allEntries.filter(b => !b.isCancelled);
      const cancelledCompensations = allEntries.filter(b => b.isCancelled);
      const pending = eligible.filter(b => !b.isPaid);
      const paid = eligible.filter(b => b.isPaid);
      const adminTransfers = eligible.filter(b => b.paymentType !== 'pandit_gives_admin_fee');
      const panditGivesAdminFees = eligible.filter(b => b.paymentType === 'pandit_gives_admin_fee');
      const compensations = cancelledCompensations;

      let list = PANDIT_PAYOUT_FILTER === 'pending' ? pending :
                 PANDIT_PAYOUT_FILTER === 'paid' ? paid :
                 PANDIT_PAYOUT_FILTER === 'admin_transfer' ? adminTransfers :
                 PANDIT_PAYOUT_FILTER === 'pandit_gives_admin_fee' ? panditGivesAdminFees :
                 PANDIT_PAYOUT_FILTER === 'compensations' ? compensations :
                 allEntries;

      if (PANDIT_PAYOUT_SEARCH) {
        const q = PANDIT_PAYOUT_SEARCH.toLowerCase();
        list = list.filter(b => 
          (b.bookingId || '').toLowerCase().includes(q) ||
          (b.userName || '').toLowerCase().includes(q) ||
          (b.userEmail || '').toLowerCase().includes(q) ||
          (b.phone || '').toLowerCase().includes(q) ||
          (b.panditName || '').toLowerCase().includes(q) ||
          (b.panditEmail || '').toLowerCase().includes(q) ||
          (b.targetPanditEmail || '').toLowerCase().includes(q) ||
          (b.service || '').toLowerCase().includes(q) ||
          (b.pujaName || '').toLowerCase().includes(q)
        );
      }

      if (!list.length) {
        return toast('No records to print in the current view', true);
      }

      let totalDakshina = 0;
      let totalAdminFee = 0;
      let totalPanditPayout = 0;
      let paidCount = 0;
      let pendingCount = 0;

      const rowsHtml = list.map((b, idx) => {
        const p = b.panditObj || (S.adminPandits || []).find(x => (x.email || '').toLowerCase() === ((b.targetPanditEmail || b.panditEmail) || '').toLowerCase());

    window.handleAdminPanditQrUpload = function(input) {
      if (!input.files || !input.files[0]) return;
      const file = input.files[0];
      if (file.size > 3 * 1024 * 1024) {
        toast('Please upload an image smaller than 3MB.', true);
        return;
      }
      const reader = new FileReader();
      reader.onload = function(e) {
        const dataUrl = e.target.result;
        const urlInput = document.getElementById('adm-p-qr');
        if (urlInput) urlInput.value = dataUrl;
        window.updateAdminPanditQrPreview(dataUrl);
      };
      reader.readAsDataURL(file);
    };

    window.updateAdminPanditQrPreview = function(url) {
      const box = document.getElementById('adm-p-qr-preview-box');
      const img = document.getElementById('adm-p-qr-preview-img');
      if (!url || !url.trim()) {
        if (box) box.style.display = 'none';
      } else {
        if (img) img.src = url.trim();
        if (box) box.style.display = 'block';
      }
    };

            <div style="grid-column:1 / -1">
              <label style="font-weight:600;font-size:12.5px;display:block;margin-bottom:4px">UPI ID (Optional)</label>
              <input type="text" id="adm-p-upi" value="${esc(p.upiId || '')}" placeholder="e.g. name@okhdfcbank">
            </div>

            <!-- Upload QR Code for Pandit (Optional) -->
            <div style="grid-column:1 / -1">
              <label style="font-weight:600;font-size:12.5px;display:flex;align-items:center;gap:6px;margin-bottom:4px">
                <span class="material-icons" style="font-size:16px;color:var(--admin-gold)">qr_code_scanner</span>
                Pandit UPI QR Code (Optional – PhonePe / GPay / Paytm / BHIM)
              </label>
              <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
                <input type="file" id="adm-p-qr-file" accept="image/*" style="font-size:12px" onchange="handleAdminPanditQrUpload(this)">
                <span class="muted" style="font-size:12px">OR URL:</span>
                <input type="text" id="adm-p-qr" value="${esc(p.qrCode || '')}" placeholder="https://... or uploaded image data" style="flex:1;min-width:200px" oninput="updateAdminPanditQrPreview(this.value)">
              </div>
              <div id="adm-p-qr-preview-box" style="margin-top:10px;${p.qrCode ? '' : 'display:none;'}">
                <div style="display:inline-flex;align-items:center;gap:12px;background:#fff;border:1.5px solid #ebd9c2;border-radius:8px;padding:8px 12px">
                  <img id="adm-p-qr-preview-img" src="${esc(p.qrCode || '')}" style="width:72px;height:72px;object-fit:contain;border:1px solid #ddd;border-radius:4px" alt="QR Preview">
                  <div>
                    <span class="badge green" style="font-size:11px">QR Attached</span>
                    <button type="button" class="btn btn-outline red btn-sm" style="margin-top:4px;display:block;font-size:11px;padding:2px 8px" onclick="document.getElementById('adm-p-qr').value='';updateAdminPanditQrPreview('');">Remove QR</button>
                  </div>
                </div>
              </div>
            </div>
          </div>
          <button class="btn btn-gold btn-lg" id="btn-save-admin-p-bank" style="width:100%">
            <span class="material-icons">save</span> Save Bank &amp; Payout Details
          </button>
        </div>
      `, (m) => {
        const saveBtn = document.getElementById('btn-save-admin-p-bank');
        if (!saveBtn) return;
        saveBtn.onclick = async () => {
          const acc = document.getElementById('adm-p-acc').value.replace(/[\s-]/g, '').trim();
          const ifsc = document.getElementById('adm-p-ifsc').value.replace(/[\s-]/g, '').trim().toUpperCase();
          const bankName = document.getElementById('adm-p-bank').value.trim();
          const holder = document.getElementById('adm-p-holder').value.trim() || p.name;
          const upi = document.getElementById('adm-p-upi').value.trim();
          const qr = document.getElementById('adm-p-qr') ? document.getElementById('adm-p-qr').value.trim() : (p.qrCode || '');

          if (!acc) return toast('Bank Account Number is required', true);
          if (!ifsc) return toast('Bank IFSC Code is required', true);

          saveBtn.disabled = true;
          saveBtn.innerHTML = '<span class="material-icons spin">sync</span> Saving...';

          try {
            const pId = p._id ? encodeURIComponent(p._id) : encodeURIComponent(p.email);
            await api('/pandits/' + pId + '/bank-details', {
              method: 'PUT',
              body: {
                email: p.email,
                bankAccount: acc,
                ifscCode: ifsc,
                bankName,
                accountHolder: holder,
                upiId: upi,
                qrCode: qr
              }
            });
            closeModal();
            toast(`Bank & Payout Details saved for Pandit ${p.name}! 🙏`);
            await loadData();
            if (returnBookingId) {
              openPanditPayModal(returnBookingId, false, returnPanditEmail);
            }
          } catch (e) {
            toast(e.message || 'Failed to save bank details', true);
            saveBtn.disabled = false;
            saveBtn.innerHTML = '<span class="material-icons">save</span> Save Bank &amp; Payout Details';
          }
        };
      });
    }

    (async function init() {
      const dbBadge = document.getElementById('admin-db-badge');
      if (dbBadge) {
        dbBadge.style.cursor = 'pointer';
        dbBadge.title = 'Click to test and reconnect MongoDB Atlas';
        dbBadge.onclick = async () => {
          const text = document.getElementById('admin-db-text');
          if (text) text.textContent = 'Connecting to MongoDB Atlas... ⏳';
          await checkDb(true);
          await loadData();
        };
      }

      document.getElementById('btn-refresh-db').onclick = async () => {
        toast('Refreshing database connection & data... 🔄');
        await checkDb(false);
        await loadData();
      };

      try {
        const r = await api('/auth/admin-direct', { method: 'POST' });
        if (r && r.token) {
          TOKEN = r.token;
          localStorage.setItem('admin_token', r.token);
          localStorage.setItem('pc_admin_token', r.token);
          toast('Super Admin Access Granted 🛡️');
        }
      } catch (e) {
        console.warn('Direct admin auth notice:', e.message);
      }

      await loadData();

      // Periodic connection check every 15s to auto-reconnect if connection was dropped
      setInterval(async () => {
        const text = document.getElementById('admin-db-text');
        const isDisconnected = text && text.textContent.includes('Disconnected');
        if (isDisconnected || document.visibilityState === 'visible') {
          await checkDb(false);
        }
      }, 15000);
    })();
  </script>
</body>
</html>
