<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PujaConnect – Super Admin Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Cinzel:wght@600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  <style>
    :root {
      --admin-bg: #f8f4ed;
      --admin-panel: #ffffff;
      --admin-border: #ebd9c2;
      --admin-gold: #d99a19;
      --admin-dark: #220e03;
    }
    body { background: var(--admin-bg); color: #2e1c12; margin: 0; font-family: Inter, system-ui, sans-serif; }
    
    .admin-header {
      background: linear-gradient(135deg, #1b0a02 0%, #2e1305 60%, #451b07 100%);
      color: #fff;
      padding: 14px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 4px 24px rgba(0,0,0,0.25);
      position: sticky;
      top: 0;
      z-index: 50;
      flex-wrap: wrap;
      gap: 12px;
    }
    .admin-title {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 19px;
      font-weight: 700;
      color: #ffd88a;
    }
    .admin-title .om { font-size: 26px; color: #f5b942; }
    .admin-controls { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    
    .db-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 12.5px;
      font-weight: 600;
      transition: all 0.3s ease;
    }
    .db-badge.connected {
      background: rgba(76, 175, 80, 0.16);
      border: 1px solid #4caf50;
      color: #81c784;
    }
    .db-badge.disconnected {
      background: rgba(244, 67, 54, 0.18);
      border: 1px solid #f44336;
      color: #e57373;
    }
    .pulse-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: currentColor;
      box-shadow: 0 0 8px currentColor;
    }
    
    .main-admin { max-width: 1240px; margin: 24px auto; padding: 0 20px 80px; }

    /* Admin Tab Navigation */
    .admin-tabs {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 6px;
      margin-bottom: 24px;
      scrollbar-width: none;
    }
    .admin-tabs::-webkit-scrollbar { display: none; }
    .admin-tab {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 18px;
      border-radius: 12px;
      background: #fff;
      border: 1px solid var(--admin-border);
      color: #4a2814;
      font-weight: 600;
      font-size: 13.5px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
    }
    .admin-tab:hover { background: #fffcf5; border-color: var(--admin-gold); }
    .admin-tab.active {
      background: var(--admin-dark);
      color: #ffd88a;
      border-color: var(--admin-dark);
      box-shadow: 0 4px 14px rgba(34, 14, 3, 0.2);
    }
    .admin-tab-pill {
      background: #e65100;
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 10px;
    }
    .admin-tab-pill.green { background: #2e7d32; }

    /* Modern Admin KPI Stat Cards */
    .admin-stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 16px;
      margin-bottom: 26px;
    }
    .kpi-card {
      background: #fff;
      border: 1px solid var(--admin-border);
      border-radius: 14px;
      padding: 18px 20px;
      box-shadow: 0 4px 18px rgba(53, 22, 5, 0.05);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .kpi-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3.5px;
      background: linear-gradient(90deg, #d99a19, #ffd166);
    }
    .kpi-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .kpi-label { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); }
    .kpi-icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fff8ed;
      color: var(--admin-gold);
    }
    .kpi-val { font-size: 28px; font-weight: 700; color: #2e1305; font-family: Georgia, serif; }

    /* Admin Panels & Tables */
    .admin-panel {
      background: #fff;
      border: 1px solid var(--admin-border);
      border-radius: 16px;
      box-shadow: 0 6px 24px rgba(53, 22, 5, 0.06);
      padding: 24px;
      margin-bottom: 24px;
    }
    .admin-panel-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 12px;
    }
    .admin-panel-head h3 { margin: 0; font-size: 19px; color: #2b1103; display: flex; align-items: center; gap: 8px; }
    
    .table-responsive {
      width: 100%;
      overflow-x: auto;
      border: 1px solid #f0e0cc;
      border-radius: 12px;
      background: #fff;
    }
    .admin-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13.5px;
      min-width: 650px;
    }
    .admin-table th {
      background: #fbf7f0;
      color: #634330;
      font-weight: 700;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 12px 14px;
      border-bottom: 2px solid #ebd9c2;
    }
    .admin-table td {
      padding: 12px 14px;
      border-bottom: 1px solid #f3e6d6;
      vertical-align: middle;
      color: #331f13;
    }
    .admin-table tr:hover td { background: #fffcf7; }
    .admin-avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #d99a19;
      box-shadow: 0 2px 6px rgba(0,0,0,0.12);
    }
    
    .search-box {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #fff;
      border: 1px solid var(--admin-border);
      border-radius: 10px;
      padding: 6px 12px;
      max-width: 320px;
      width: 100%;
    }
    .search-box input { border: none; padding: 4px; outline: none; width: 100%; font-size: 13px; }
    .search-box .material-icons { color: var(--muted); font-size: 18px; }

    .th-cb, .td-cb {
      width: 42px !important;
      text-align: center !important;
      padding-left: 8px !important;
      padding-right: 8px !important;
    }
    .admin-table input[type="checkbox"] {
      width: 17px;
      height: 17px;
      cursor: pointer;
      accent-color: var(--admin-gold);
      vertical-align: middle;
    }
    .bulk-bar {
      background: #fff8ed;
      border: 1.5px solid #d99a19;
      border-radius: 10px;
      padding: 10px 16px;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    @media print {
      body { background: #fff !important; color: #000 !important; font-size: 10pt !important; margin: 0 !important; padding: 0 !important; }
      .admin-header, .admin-tabs, #admin-kpi-root, .admin-controls, .search-box, .btn, .no-print, .bulk-bar, .modal-backdrop, .toast {
        display: none !important;
      }
      .main-admin, .admin-panel {
        max-width: 100% !important;
        margin: 0 !important;
        padding: 0 !important;
        border: none !important;
        box-shadow: none !important;
        background: transparent !important;
      }
      .table-responsive {
        overflow: visible !important;
        border: none !important;
      }
      .admin-table {
        width: 100% !important;
        min-width: 100% !important;
        border-collapse: collapse !important;
      }
      .admin-table th, .admin-table td {
        border: 1px solid #777 !important;
        padding: 6px 8px !important;
        color: #000 !important;
        background: #fff !important;
        font-size: 10.5px !important;
        word-break: break-word !important;
      }
      .admin-table th { background: #eee !important; }
      .th-cb, .td-cb, .admin-table th:last-child, .admin-table td:last-child {
        display: none !important;
      }
    }
  </style>
</head>
<body>
  <header class="admin-header">
    <div class="admin-title">
      <span class="om">ॐ</span>
      <span>PujaConnect Executive Portal</span>
      <span class="role-badge" style="background:#55280b;border:1px solid #d99a19;color:#ffd88a;font-size:11px">Super Admin</span>
    </div>
    <div class="admin-controls">
      <div id="admin-db-badge" class="db-badge connected">
        <span class="pulse-dot"></span>
        <span id="admin-db-text">Checking Database...</span>
      </div>
      <button class="btn btn-outline" id="btn-refresh-db" style="padding:6px 12px;font-size:12px;color:#ffd88a;border-color:#ffd88a">
        <span class="material-icons" style="font-size:14px;vertical-align:middle">sync</span> Refresh Data
      </button>
      <a href="/#puja-prices" target="_blank" class="btn btn-outline" style="padding:6px 14px;font-size:13px;color:#ffd88a;border-color:#ffd88a;text-decoration:none">
        <span class="material-icons" style="font-size:16px;vertical-align:middle">receipt_long</span> A4 Price Chart
      </a>
      <a href="/" class="btn btn-gold" style="padding:6px 14px;font-size:13px;text-decoration:none">
        <span class="material-icons" style="font-size:16px;vertical-align:middle">public</span> View Website
      </a>
    </div>
  </header>

  <main class="main-admin">
    <div id="admin-kpi-root"></div>

    <!-- Subtabs -->
    <div class="admin-tabs">
      <button class="admin-tab active" data-tab="bookings" onclick="switchAdminTab('bookings')">
        <span class="material-icons">event_available</span> Bookings &amp; Assignments <span id="badge-bookings-count" class="admin-tab-pill">0</span>
      </button>
      <button class="admin-tab" data-tab="kyc" onclick="switchAdminTab('kyc')">
        <span class="material-icons">verified_user</span> KYC Queue <span id="badge-kyc-count" class="admin-tab-pill">0</span>
      </button>
      <button class="admin-tab" data-tab="pandits" onclick="switchAdminTab('pandits')">
        <span class="material-icons">badge</span> Pandits Directory &amp; Rates
      </button>
      <button class="admin-tab" data-tab="pujas" onclick="switchAdminTab('pujas')">
        <span class="material-icons">spa</span> Puja Catalog
      </button>
      <button class="admin-tab" data-tab="longs" onclick="switchAdminTab('longs')">
        <span class="material-icons">event_note</span> Multi-Day Requests <span id="badge-long-count" class="admin-tab-pill">0</span>
      </button>
      <button class="admin-tab" data-tab="payments" onclick="switchAdminTab('payments')">
        <span class="material-icons">payments</span> Payment Verifications <span id="badge-payments-count" class="admin-tab-pill">0</span>
      </button>
      <button class="admin-tab" data-tab="pandit-payouts" onclick="switchAdminTab('pandit-payouts')">
        <span class="material-icons">account_balance_wallet</span> Pandit Payment <span id="badge-pandit-payouts-count" class="admin-tab-pill">0</span>
      </button>
      <button class="admin-tab" data-tab="platform-bank" onclick="switchAdminTab('platform-bank')">
        <span class="material-icons">account_balance</span> Platform Bank &amp; UPI
      </button>
      <button class="admin-tab" data-tab="users" onclick="switchAdminTab('users')">
        <span class="material-icons">group</span> Devotees
      </button>
      <button class="admin-tab" data-tab="media" onclick="switchAdminTab('media')">
        <span class="material-icons">campaign</span> Media &amp; Offers <span id="badge-media-count" class="admin-tab-pill">0</span>
      </button>
      <button class="admin-tab" data-tab="settings" onclick="switchAdminTab('settings')">
        <span class="material-icons">settings</span> System Settings
      </button>
    </div>

    <div id="admin-view-root">
      <div class="empty">Loading Super Admin Dashboard…</div>
    </div>
  </main>

  <div id="modal-root"></div>
  <div id="toast" class="toast"></div>

  <script>
    let TOKEN = localStorage.getItem('pc_admin_token') || localStorage.getItem('admin_token') || localStorage.getItem('pc_token') || '';
    let CURRENT_TAB = 'bookings';
    let SEARCH_QUERY = '';
    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const inr = (n) => '₹' + Number(n || 0).toLocaleString('en-IN');

    function isPanditAvailableOnDate(p, dateStr) {
      if (!p || !dateStr) return { available: true };
      const dStr = String(dateStr).trim().split('T')[0];

      // 1. Check marked non-availability
      const unavail = p.unavailableDates || [];
      for (const item of unavail) {
        const itemDate = typeof item === 'string' ? item.trim() : (item && item.date ? item.date.trim() : '');
        if (itemDate === dStr) {
          const reason = (typeof item === 'object' && item.reason) ? ` (${item.reason})` : '';
          return { available: false, reason: `Marked Non-Availability${reason}` };
        }
      }

      // 2. Check availableDays of the week
      if (Array.isArray(p.availableDays) && p.availableDays.length) {
        const parts = dStr.split('-');
        if (parts.length === 3) {
          const dt = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
          const dayNames = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
          const dayName = dayNames[dt.getDay()];
          if (!p.availableDays.includes(dayName)) {
            return { available: false, reason: `Not scheduled on ${dayName}s` };
          }
        }
      }

      return { available: true };
    }

    const SELECTED = {
      bookings: new Set(),
      pandits: new Set(),
      payments: new Set(),
      users: new Set()
    };

    function toggleSelectRow(type, id, checked) {
      if (!SELECTED[type]) SELECTED[type] = new Set();
      if (checked) {
        SELECTED[type].add(id);
      } else {
        SELECTED[type].delete(id);
      }
      renderActiveTab();
    }

    function toggleSelectAll(type, checked, allIds) {
      if (!SELECTED[type]) SELECTED[type] = new Set();
      if (checked) {
        allIds.forEach(id => SELECTED[type].add(id));
      } else {
        allIds.forEach(id => SELECTED[type].delete(id));
      }
      renderActiveTab();
    }

    function clearSelection(type) {
      if (SELECTED[type]) SELECTED[type].clear();
      renderActiveTab();
    }

    function getBulkBarHtml(type, singularLabel, deleteFnName) {
      const count = (SELECTED[type] && SELECTED[type].size) || 0;
      if (!count) return '';
      return `
        <div class="bulk-bar">
          <div style="display:flex;align-items:center;gap:8px">
            <span class="material-icons" style="color:var(--admin-gold);font-size:20px">check_box</span>
            <b style="color:var(--admin-dark);font-size:13.5px">${count} ${singularLabel}${count > 1 ? 's' : ''} selected</b>
          </div>
          <div style="display:flex;gap:8px;align-items:center">
            <button class="btn btn-red btn-sm" onclick="${deleteFnName}()">
              <span class="material-icons" style="font-size:14px;vertical-align:middle">delete</span> Delete Selected (${count})
            </button>
            <button class="btn btn-outline dark btn-sm" onclick="clearSelection('${type}')">
              Deselect All
            </button>
          </div>
        </div>
      `;
    }

    function toast(msg, isErr) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.className = 'toast show' + (isErr ? ' error' : '');
      clearTimeout(toast._t);
      toast._t = setTimeout(() => (t.className = 'toast'), 3500);
    }

    const API_BASE = (function() {
      if (typeof window !== 'undefined') {
        const p = window.location.protocol;
        const h = window.location.hostname;
        const port = window.location.port;
        // If opened as local file or via live-server / alternative dev server on non-5500 port
        if (p === 'file:' || ((h === 'localhost' || h === '127.0.0.1') && port && port !== '5500')) {
          return 'http://localhost:5500/api';
        }
      }
      return '/api';
    })();

    async function api(path, { method = 'GET', body } = {}) {
      const res = await fetch(API_BASE + path, {
        method,
        headers: {
          'Content-Type': 'application/json',
          ...(TOKEN ? { Authorization: 'Bearer ' + TOKEN } : {})
        },
        body: body ? JSON.stringify(body) : undefined
      });
      let data = null;
      try { data = await res.json(); } catch {}
      if (!res.ok) throw new Error((data && data.error) || 'Request failed (' + res.status + ')');
      return data;
    }

    function openModal(title, html, onMount) {
      document.getElementById('modal-root').innerHTML = `
        <div class="modal-backdrop" onclick="if(event.target===this)closeModal()">
          <div class="modal modal-wide">
            <div class="modal-head">
              <h3>${esc(title)}</h3>
              <button onclick="closeModal()" aria-label="Close"><span class="material-icons">close</span></button>
            </div>
            <div class="modal-body">${html}</div>
          </div>
        </div>`;
      if (onMount) onMount(document.querySelector('.modal'));
    }
    function closeModal() { document.getElementById('modal-root').innerHTML = ''; }

    function adminConfirm({
      title = 'Confirmation Required',
      message = 'Are you sure you want to proceed?',
      detail = '',
      confirmText = 'Confirm',
      confirmClass = 'btn-gold',
      cancelText = 'Cancel',
      icon = 'help_outline'
    } = {}) {
      return new Promise((resolve) => {
        openModal(title, `
          <div style="text-align:center;padding:12px 8px">
            <span class="material-icons" style="font-size:46px;color:var(--admin-gold);display:block;margin-bottom:10px">${icon}</span>
            <h4 style="margin:0 0 8px;font-size:16.5px;color:#2c180a">${esc(message)}</h4>
            ${detail ? `<p style="font-size:13px;color:#7a6252;margin:0 0 18px;line-height:1.5">${esc(detail)}</p>` : '<div style="margin-bottom:18px"></div>'}
            <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
              <button type="button" class="btn btn-outline" id="admin-confirm-cancel" style="min-width:110px">${esc(cancelText)}</button>
              <button type="button" class="btn ${confirmClass}" id="admin-confirm-ok" style="min-width:130px">${esc(confirmText)}</button>
            </div>
          </div>
        `, (m) => {
          const cancelBtn = document.getElementById('admin-confirm-cancel');
          const okBtn = document.getElementById('admin-confirm-ok');
          if (cancelBtn) cancelBtn.onclick = () => { closeModal(); resolve(false); };
          if (okBtn) okBtn.onclick = () => { closeModal(); resolve(true); };
        });
      });
    }

    function adminPrompt({
      title = 'Action Required',
      message = '',
      label = 'Rejection Reason',
      placeholder = '',
      defaultValue = '',
      confirmText = 'Submit',
      confirmClass = 'btn-gold',
      cancelText = 'Cancel',
      icon = 'edit_note'
    } = {}) {
      return new Promise((resolve) => {
        openModal(title, `
          <div style="padding:6px 4px">
            ${message ? `<div style="display:flex;align-items:center;gap:8px;margin-bottom:14px;color:#2c180a;font-weight:600;font-size:14px"><span class="material-icons" style="color:var(--admin-gold);font-size:22px">${icon}</span><span>${esc(message)}</span></div>` : ''}
            <div style="margin-bottom:16px">
              <label style="font-weight:600;display:block;margin-bottom:6px;font-size:13px">${esc(label)}</label>
              <textarea id="admin-prompt-input" rows="3" placeholder="${esc(placeholder)}" style="width:100%;box-sizing:border-box;border:1.5px solid #d99a19;border-radius:8px;padding:10px;font-family:inherit;font-size:13.5px;line-height:1.4">${esc(defaultValue)}</textarea>
            </div>
            <div style="display:flex;gap:10px;justify-content:flex-end">
              <button type="button" class="btn btn-outline" id="admin-prompt-cancel">${esc(cancelText)}</button>
              <button type="button" class="btn ${confirmClass}" id="admin-prompt-ok">${esc(confirmText)}</button>
            </div>
          </div>
        `, (m) => {
          const inp = document.getElementById('admin-prompt-input');
          if (inp) {
            inp.focus();
            inp.select();
          }
          const cancelBtn = document.getElementById('admin-prompt-cancel');
          const okBtn = document.getElementById('admin-prompt-ok');
          if (cancelBtn) cancelBtn.onclick = () => { closeModal(); resolve(null); };
          if (okBtn) okBtn.onclick = () => {
            const val = (document.getElementById('admin-prompt-input').value || '').trim();
            closeModal();
            resolve(val);
          };
        });
      });
    }

    function statusBadge(s) {
      const cls = { 'Verified': 'green', 'Pending Review': 'amber', 'Rejected': 'red', 'Declined': 'red', 'Rejected by Pandit': 'red', 'Confirmed': 'green', 'Completed': 'green', 'Cancelled': 'red', 'Assigned': 'green', 'Pending Admin': 'amber' }[s] || 'amber';
      return `<span class="badge ${cls}">${esc(s)}</span>`;
    }

    async function checkDb(showToast = false) {
      const badge = document.getElementById('admin-db-badge');
      const text = document.getElementById('admin-db-text');
      if (!badge || !text) return;
      try {
        const d = await api('/db-status');
        if (d && d.connected) {
          badge.className = 'db-badge connected';
          text.textContent = 'MongoDB Atlas Connected 🟢';
          if (showToast) toast('MongoDB Atlas connected & healthy! 🟢');
        } else {
          badge.className = 'db-badge disconnected';
          text.textContent = 'Database Disconnected 🔴 (Click to Reconnect)';
          if (showToast) toast('Database is not yet connected. Click badge to reconnect.', true);
        }
      } catch (e) {
        badge.className = 'db-badge disconnected';
        text.textContent = 'Database Disconnected 🔴 (Click to Reconnect)';
        if (showToast) toast('Backend connection issue: ' + (e.message || 'Check local server on port 5500'), true);
      }
    }

    let S = { adminPandits: [], adminLongs: [], pujas: [], users: [], bookings: [], stats: {}, commissionPercent: 10, mediaOffers: [], mediaAnnouncements: [], mediaDevotees: null };

    async function loadData() {
      // Run DB status check concurrently in parallel so it never delays data fetching
      checkDb().catch(() => {});
      try {
        const [stats, pandits, longs, users, pujas, bookings, commissionData, offers, announcements, mediaDevotees] = await Promise.all([
          api('/admin/stats').catch(() => ({ users: 0, pandits: 0, verifiedPandits: 0, pendingPandits: 0, bookings: 0, completed: 0, revenue: 0, longRequests: 0, pendingLong: 0 })),
          api('/pandits').catch(() => []),
          api('/long-puja-requests').catch(() => []),
          api('/users').catch(() => []),
          api('/pujas').catch(() => []),
          api('/bookings').catch(() => []),
          api('/platform-commission').catch(() => ({ commissionPercent: 10 })),
          api('/media/offers').catch(() => []),
          api('/media/announcements').catch(() => []),
          api('/admin/media/devotees').catch(() => ({ totalDevotees: 0, states: {} }))
        ]);
        S.stats = stats || {};
        S.adminPandits = Array.isArray(pandits) ? pandits : [];
        S.adminLongs = Array.isArray(longs) ? longs : [];
        S.users = Array.isArray(users) ? users : [];
        S.pujas = Array.isArray(pujas) ? pujas : [];
        S.bookings = Array.isArray(bookings) ? bookings : [];
        S.commissionPercent = (commissionData && (typeof commissionData.percent === 'number' ? commissionData.percent : commissionData.commissionPercent)) ?? 10;
        S.mediaOffers = Array.isArray(offers) ? offers : [];
        S.mediaAnnouncements = Array.isArray(announcements) ? announcements : [];
        S.mediaDevotees = mediaDevotees || { totalDevotees: 0, states: {} };

        renderKpis();
        renderActiveTab();
      } catch (e) {
        console.error('loadData error:', e);
        document.getElementById('admin-view-root').innerHTML = `<div class="empty error">Error loading admin data: ${esc(e.message)}</div>`;
      }
    }

    function getPanditPayoutEntries() {
      const currentPct = Number(S.commissionPercent !== undefined ? S.commissionPercent : 10);
      const out = [];

      // 1. Standard bookings
      (S.bookings || []).forEach(b => {
        const isCancelled = b.status === 'Cancelled';
        const devoteePaid = b.paymentStatus === 'Paid' || b.paymentStatus === 'Paid & Verified';
        const hasPandit = Boolean(b.panditEmail);
        const eligibleRegular = hasPandit && (devoteePaid || ['Completed', 'Confirmed', 'In Progress'].includes(b.status));
        const eligibleCancel = hasPandit && isCancelled && (Number(b.panditCompensationAmount) > 0 || Number(b.cancellationFeeAmount) > 0);

        if (eligibleRegular || eligibleCancel) {
          const p = (S.adminPandits || []).find(x => (x.email || '').toLowerCase() === (b.panditEmail || '').toLowerCase());
          const mainFee = Number(b.fee) || 1500;
          const feePct = Number(b.adminFeePercent !== undefined ? b.adminFeePercent : currentPct);
          const adminFeeAmount = Number(b.adminFeeAmount !== undefined ? b.adminFeeAmount : Math.round((mainFee * feePct) / 100));
          const otherFee = Number(b.otherFee || 0);
          const netDakshina = Number(b.panditNetPayout !== undefined && b.panditNetPayout > 0 ? b.panditNetPayout : (b.panditPayoutAmount || Math.max(0, mainFee - adminFeeAmount - otherFee)));
          const isPaid = isCancelled ? (b.panditCompensationStatus === 'Paid') : (b.panditPayoutStatus === 'Paid');
          const paymentType = b.paymentType || (b.paymentMethod === 'Cash Paid to Pandit' ? 'pandit_gives_admin_fee' : 'admin_transfer');

          out.push({
            ...b,
            isLong: false,
            key: `std_${b.bookingId}_${b.panditEmail}`,
            bookingId: b.bookingId,
            id: b.bookingId,
            service: b.service,
            pujaName: b.service,
            userName: b.userName,
            userEmail: b.userEmail,
            phone: b.phone || b.userPhone || '',
            date: b.date,
            time: b.time || '10:00 AM',
            address: b.address || b.district,
            district: b.district,
            targetPanditEmail: b.panditEmail,
            panditEmail: b.panditEmail,
            panditName: b.panditName,
            panditObj: p,
            mainFee,
            totalCeremonyFee: mainFee,
            feePct,
            adminFeeAmount,
            otherFee,
            netDakshina,
            paymentType,
            isCancelled,
            isPaid,
            devoteePaid,
            panditPayoutStatus: isPaid ? 'Paid' : 'Pending',
            panditPayoutAmount: b.panditPayoutAmount || netDakshina,
            panditPayoutDate: b.panditPayoutDate,
            panditPayoutTxnId: b.panditPayoutTxnId,
            panditPayoutMethod: b.panditPayoutMethod,
            panditCompensationAmount: Number(b.panditCompensationAmount) || 0,
            panditCompensationStatus: b.panditCompensationStatus || 'N/A',
            panditCompensationTxnId: b.panditCompensationTxnId || ''
          });
        }
      });

      // 2. Long (multi-day) ceremonies
      (S.adminLongs || []).forEach(l => {
        const isCancelled = l.status === 'Cancelled';
        const devoteePaid = l.paymentStatus === 'Paid' || l.paymentStatus === 'Paid & Verified';
        const assignedList = Array.isArray(l.assignedPandits) && l.assignedPandits.length > 0 ? l.assignedPandits : [];
        const eligibleRegular = assignedList.length > 0 && (devoteePaid || ['Completed', 'Confirmed', 'In Progress'].includes(l.status));
        const eligibleCancel = assignedList.length > 0 && isCancelled && (Number(l.refundAmount) > 0 || (l.advancePaid && Number(l.advanceAmount) > 0));

        if (eligibleRegular || eligibleCancel) {
          const teamSize = Math.max(1, Number(l.requiredPandits) || assignedList.length);
          const totalCost = Number(l.estimatedCost) || 0;
          const perPanditGross = Math.round(totalCost / teamSize);
          const feePct = Number(l.adminFeePercent !== undefined ? l.adminFeePercent : currentPct);
          const adminFeeAmount = Math.round((perPanditGross * feePct) / 100);
          const otherFee = Number(l.otherFee || 0);
          const netDakshina = Math.max(0, perPanditGross - adminFeeAmount - otherFee);

          assignedList.forEach(pEmail => {
            const pEmailLc = (pEmail || '').toLowerCase();
            const p = (S.adminPandits || []).find(x => (x.email || '').toLowerCase() === pEmailLc);
            const pPayoutInfo = (l.panditPayouts && l.panditPayouts[pEmailLc]) || {};
            const pIsPaid = isCancelled ? false : (pPayoutInfo.payoutStatus === 'Paid' || (l.panditPayoutStatus === 'Paid' && assignedList.length === 1));
            const paymentType = pPayoutInfo.paymentType || l.paymentType || (l.paymentMethod === 'Cash Paid to Pandit' ? 'pandit_gives_admin_fee' : 'admin_transfer');

            out.push({
              ...l,
              isLong: true,
              key: `long_${l.id}_${pEmailLc}`,
              bookingId: l.id,
              id: l.id,
              service: `${l.pujaName} (Multi-Day Ceremony · ${l.totalDays} Days · ${l.totalHours}h Total · ${teamSize} Pandits)`,
              pujaName: l.pujaName,
              totalDays: l.totalDays,
              dailyHours: l.dailyHours,
              totalHours: l.totalHours,
              requiredPandits: teamSize,
              userName: l.userName,
              userEmail: l.userEmail,
              phone: l.phone || '',
              date: `${l.fromDate} → ${l.toDate} (${l.totalDays} Days)`,
              time: `${l.dailyHours}h/day, Start: ${l.startTime || '08:00 AM'}`,
              address: l.venueAddress || l.venue || l.address || l.district,
              district: l.district,
              targetPanditEmail: pEmailLc,
              panditEmail: pEmailLc,
              panditName: p ? p.name : (pPayoutInfo.panditName || pEmail),
              panditObj: p,
              mainFee: perPanditGross,
              totalCeremonyFee: totalCost,
              feePct,
              adminFeeAmount,
              otherFee,
              netDakshina: pPayoutInfo.netPayout || netDakshina,
              paymentType,
              isCancelled,
              isPaid: pIsPaid,
              devoteePaid,
              panditPayoutStatus: pIsPaid ? 'Paid' : 'Pending',
              panditPayoutAmount: pPayoutInfo.payoutAmount || (pIsPaid ? l.panditPayoutAmount : netDakshina),
              panditPayoutDate: pPayoutInfo.payoutDate || l.panditPayoutDate,
              panditPayoutTxnId: pPayoutInfo.payoutTxnId || l.panditPayoutTxnId || '',
              panditPayoutMethod: pPayoutInfo.payoutMethod || l.panditPayoutMethod || '',
              panditCompensationAmount: 0,
              panditCompensationStatus: 'N/A'
            });
          });
        }
      });

      return out;
    }

    function renderKpis() {
      const s = S.stats;
      const pendKyc = S.adminPandits.filter(p => p.status === 'Pending Review').length;
      const pendLong = S.adminLongs.filter(l => l.status === 'Pending Admin' || ['Rejected', 'Declined', 'Rejected by Pandit'].includes(l.status)).length;
      const hasRejectedLong = S.adminLongs.some(l => ['Rejected', 'Declined', 'Rejected by Pandit'].includes(l.status));
      const pendPayments = (S.bookings || []).filter(b => b.paymentStatus === 'Under Processing' || b.paymentStatus === 'Verification Pending').length;
      const pendRefunds = (S.bookings || []).filter(b => b.status === 'Cancelled' && (b.refundStatus === 'Pending Refund' || ((b.refundAmount || 0) > 0 && b.refundStatus !== 'Refunded'))).length;

      const allPayoutEntries = getPanditPayoutEntries();
      const pendPanditPayouts = allPayoutEntries.filter(b => !b.isPaid && !b.isCancelled).length;

      const kycBadge = document.getElementById('badge-kyc-count');
      if (kycBadge) kycBadge.textContent = pendKyc;
      const longBadge = document.getElementById('badge-long-count');
      if (longBadge) {
        longBadge.textContent = pendLong;
        if (hasRejectedLong) {
          longBadge.style.background = '#c62828';
          longBadge.title = 'Attention: Some multi-day requests were rejected by Pandit and require re-assignment';
        } else {
          longBadge.style.background = '';
          longBadge.title = '';
        }
      }
      const pendBookings = (S.bookings || []).filter(b => b.status === 'Pending Assignment' || b.panditApproval === 'Rejected').length;
      const bookBadge = document.getElementById('badge-bookings-count');
      if (bookBadge) bookBadge.textContent = pendBookings;
      const payoutBadge = document.getElementById('badge-pandit-payouts-count');
      if (payoutBadge) payoutBadge.textContent = pendPanditPayouts;
      const paymentsBadge = document.getElementById('badge-payments-count');
      if (paymentsBadge) paymentsBadge.textContent = (pendPayments + pendRefunds);
      const mediaBadge = document.getElementById('badge-media-count');
      if (mediaBadge) {
        const activeOffers = (S.mediaOffers || []).filter(o => o.status === 'Active').length;
        mediaBadge.textContent = activeOffers;
      }

      const kpis = [
        { label: 'Pending Pandit Assignment', val: pendBookings, icon: 'person_search', alert: pendBookings > 0 },
        { label: 'Registered Devotees', val: s.users || 0, icon: 'people' },
        { label: 'Verified Pandits', val: s.verifiedPandits || 0, icon: 'verified' },
        { label: 'Pending Devotee Refunds', val: pendRefunds, icon: 'currency_exchange', alert: pendRefunds > 0 },
        { label: 'Pending Devotee Payments', val: pendPayments, icon: 'receipt_long', alert: pendPayments > 0 },
        { label: 'Pending Pandit Payouts', val: pendPanditPayouts, icon: 'account_balance_wallet', alert: pendPanditPayouts > 0 },
        { label: 'Total Ceremonies', val: s.bookings || 0, icon: 'event' },
        { label: 'Completed Pujas', val: s.completed || 0, icon: 'task_alt' },
        { label: 'Booked Dakshina', val: inr(s.revenue || 0), icon: 'payments' },
        { label: 'Custom Mahayajnas', val: `${pendLong}/${s.longRequests || 0}`, icon: 'auto_stories' }
      ];

      document.getElementById('admin-kpi-root').innerHTML = `
        <div class="admin-stats-grid">
          ${kpis.map(k => `
            <div class="kpi-card" ${k.alert ? 'style="border-color:#e65100"' : ''}>
              <div class="kpi-head">
                <span class="kpi-label">${k.label}</span>
                <span class="kpi-icon"><span class="material-icons">${k.icon}</span></span>
              </div>
              <div class="kpi-val" ${k.alert ? 'style="color:#e65100"' : ''}>${k.val}</div>
            </div>
          `).join('')}
        </div>
      `;
    }

      CURRENT_TAB = tab;
      document.querySelectorAll('.admin-tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
      renderActiveTab();
    }

      const root = document.getElementById('admin-view-root');
      if (CURRENT_TAB === 'bookings') renderBookingsAssignments(root);
      else if (CURRENT_TAB === 'kyc') renderKycQueue(root);
      else if (CURRENT_TAB === 'pandits') renderPanditsDirectory(root);
      else if (CURRENT_TAB === 'pujas') renderPujaCatalog(root);
      else if (CURRENT_TAB === 'longs') renderLongRequests(root);
      else if (CURRENT_TAB === 'payments') renderPaymentsVerification(root);
      else if (CURRENT_TAB === 'pandit-payouts') renderPanditPaymentsSection(root);
      else if (CURRENT_TAB === 'platform-bank') renderPlatformBankTab(root);
      else if (CURRENT_TAB === 'users') renderDevoteesDirectory(root);
      else if (CURRENT_TAB === 'media') renderMediaSection(root);
      else if (CURRENT_TAB === 'settings') renderSystemSettingsTab(root);

      const eligible = (S.adminPandits || []).filter(p => p.verified && ((p.workingDistricts || []).includes(b.district) || p.district === b.district));
      const fallback = eligible.length ? eligible : (S.adminPandits || []).filter(p => p.verified);
      const prevRejected = (b.rejectedPandits || []).map(x => x.toLowerCase());

      openModal(`Assign Pandit – ${b.bookingId}`, `

            <div><b>Ceremony Schedule:</b> ${esc(b.date)} · ${esc(b.time)}</div>

            const adminComm = Math.round((finalPujFee * (b.adminFeePercent || S.commissionPercent || 10)) / 100);

                <div style="flex:1">
                  <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
                    <b style="color:var(--admin-dark)">${esc(p.name)}</b>

                    ${wasRejected ? '<span class="badge red" style="font-size:10.5px">Declined Earlier</span>' : ''}
                    ${isUnavail ? `<span class="badge red" style="font-size:10.5px;font-weight:700">⚠️ Pandit Not Available That Day (${esc(avail.reason)})</span>` : '<span class="badge green" style="font-size:10.5px">Verified &amp; Available</span>'}

                  <div class="muted" style="font-size:12px;margin-top:2px">
                    Exp: ${esc(p.exp || p.experience + ' Yrs')} · Home: ${esc(p.district)} · Serves: ${(p.workingDistricts || [p.district]).join(', ')}
                  </div>
                  ${isUnavail ? `<div style="font-size:11.5px;color:#c62828;font-weight:700;margin-top:3px">⚠️ Pandit cannot be assigned on ${esc(b.date)}: ${esc(avail.reason)}</div>` : ''}
                </div>
                <div style="text-align:right">
                  ${discAmt > 0 ? `
                    <div style="font-size:11px;color:#8a6a55;text-decoration:line-through">${inr(distFee)}</div>
                    <b style="color:var(--admin-gold);font-size:14px">${inr(finalPujFee)}</b>
                    <div style="font-size:10.5px;color:#2e7d32;font-weight:600">Net Profit: ${inr(panditNetProf)}</div>
                    <div class="badge green" style="font-size:9.5px;padding:1px 4px">${discPct}% OFF</div>
                  ` : `
                    <b style="color:var(--admin-gold);font-size:14px">${inr(distFee)}</b>
                    <div style="font-size:10.5px;color:#2e7d32;font-weight:600">Net Profit: ${inr(panditNetProf)}</div>
                    <div class="muted" style="font-size:11px">for ${esc(b.district)}</div>
                  `}
                </div>
              </label>
            `;
          }).join('') || '<div class="empty">No verified Pandits found for this district.</div>'}
        </div>

        <button class="btn btn-gold btn-lg" id="btn-confirm-assign-pandit" style="width:100%;margin-top:16px">
          <span class="material-icons">send</span> Confirm Assignment &amp; Send Offer to Pandit
        </button>
      `, (m) => {
        const btn = m.querySelector('#btn-confirm-assign-pandit');
        if (btn) {
          btn.onclick = async () => {
            const checked = m.querySelector('input[name="selected-pandit"]:checked');
            if (!checked) return toast('Please select a Pandit from the list', true);
            if (checked.dataset.unavail === '1') {
              return toast(`⚠️ Pandit ${checked.dataset.panditName} is not available on ${b.date} (${checked.dataset.unavailReason}). Please select an available Pandit.`, true);
            }
            btn.disabled = true;
            btn.innerHTML = '<span class="material-icons spin">sync</span> Assigning Pandit...';
            try {
              const res = await api(`/bookings/${b.bookingId}/assign-pandit`, {
                method: 'PUT',
                body: { panditEmail: checked.value }
              });
              closeModal();
              if (res && res.emailSent === false) {
                toast(`⚠️ Pandit assigned, but notification email delivery issue: ${res.emailError || 'SMTP Delivery Issue'}. You can use "Resend Mail" anytime.`, true);
              } else {
                toast(`✅ Pandit assigned & ceremony offer email sent to ${checked.value}! 🙏`);
              }
              loadData();
            } catch (err) {
              toast(err.message, true);
              btn.disabled = false;
              btn.innerHTML = '<span class="material-icons">send</span> Confirm Assignment &amp; Send Offer to Pandit';
            }
          };
        }
      });

              <b>Admin Commission:</b> <span style="color:#c62828">-₹${adminCut.toLocaleString('en-IN')}</span><br>

    async function rejectBookingSlotClash(id) {
      const b = (S.bookings || []).find(x => x.bookingId === id);
      const defaultReason = 'No verified Vedic Pandit is available for this date and time slot. Please reschedule or rebook with another date/time.';
      const reason = await adminPrompt({
        title: 'Reject Ceremony Slot (No Pandit Available for this time slot)',
        message: `Devotee ${b ? b.userName : ''} requested ${b ? b.service : 'Puja'} on ${b ? b.date + ' at ' + (b.time || '') : 'this slot'}.`,
        label: 'Rejection Reason (will be emailed to devotee with Rebook link):',
        placeholder: defaultReason,
        defaultValue: defaultReason,
        confirmText: 'Reject Slot & Send Rebook Mail',
        confirmClass: 'btn-red',
        icon: 'event_busy'
      });
      if (reason === null) return;

      try {
        await api('/bookings/' + encodeURIComponent(id) + '/reject-slot', {
          method: 'POST',
          body: { reason: reason.trim() || defaultReason }
        });
        toast('Booking marked as Rejected (No Pandit for Slot). Rebook email sent to Devotee! 🙏');
        closeModal();
        loadData();
      } catch (e) {
        toast(e.message, true);
      }
    }

    async function deleteBooking(bookingId) {
      const ok = await adminConfirm({
        title: 'Delete Ceremony Booking',
        message: `Delete Booking ${bookingId}?`,
        detail: 'This will permanently remove the ceremony booking, its assignment, and linked payment records from the system. This action cannot be undone.',
        confirmText: 'Delete Booking',
        confirmClass: 'btn-red',
        icon: 'delete_forever'
      });
      if (!ok) return;

      try {
        await api('/bookings/' + encodeURIComponent(bookingId), { method: 'DELETE' });
        S.bookings = (S.bookings || []).filter(b => b.bookingId !== bookingId && b._id !== bookingId);
        SELECTED.bookings.delete(bookingId);
        SELECTED.payments.delete(bookingId);
        toast(`Booking ${bookingId} deleted successfully`);
        renderKpis();
        renderActiveTab();
      } catch (e) {
        toast('Error deleting booking: ' + e.message, true);
      }
    }

    async function deleteSelectedBookings() {
      const ids = Array.from(SELECTED.bookings);
      if (!ids.length) return;
      const ok = await adminConfirm({
        title: 'Bulk Delete Bookings',
        message: `Permanently delete ${ids.length} selected booking(s)?`,
        detail: 'All selected ceremony bookings, schedules, and linked payment records will be permanently removed from the platform. This action cannot be undone.',
        confirmText: `Delete ${ids.length} Bookings`,
        confirmClass: 'btn-red',
        icon: 'delete_sweep'
      });
      if (!ok) return;

      try {
        const res = await api('/bookings/bulk-delete', { method: 'POST', body: { ids } });
        const idSet = new Set(ids);
        S.bookings = (S.bookings || []).filter(b => !idSet.has(b.bookingId) && !idSet.has(b._id));
        SELECTED.bookings.clear();
        ids.forEach(id => SELECTED.payments.delete(id));
        toast(`${res.count || ids.length} bookings deleted successfully`);
        renderKpis();
        renderActiveTab();
      } catch (e) {
        toast('Error in bulk delete: ' + e.message, true);
      }
    }

      openModal(`Book / Rebook Ceremony for ${name}`, `

            </select>
          </div>
          <div>
            <label>Ceremony District *</label>
            <input id="rb-district" value="${esc(district || 'Khordha')}" placeholder="District">
          </div>
          <div>
            <label>Ceremony Date *</label>
            <input type="date" id="rb-date" value="${new Date().toISOString().split('T')[0]}">
          </div>
          <div>
            <label>Ceremony Time Slot *</label>
            <select id="rb-time">
              <option value="08:00 AM - 11:00 AM">08:00 AM - 11:00 AM (Morning)</option>
              <option value="11:30 AM - 02:30 PM">11:30 AM - 02:30 PM (Midday)</option>
              <option value="04:00 PM - 07:00 PM">04:00 PM - 07:00 PM (Evening)</option>
            </select>

                const curDate = (new Date()).toISOString().split('T')[0];
                const avail = isPanditAvailableOnDate(p, curDate);
                return `<option value="${esc(p.email)}" ${!avail.available ? 'style="color:#c62828"' : ''}>Pt. ${esc(p.name)} [Specialty: ${esc(p.specialty || 'Vedic Rituals')}] (${esc(servesTag)}) — Dakshina: ${inr(p.fee)}${!avail.available ? ` [⚠️ NOT AVAILABLE: ${avail.reason}]` : ''}</option>`;
              }).join('')}
            </select>
            <div id="rb-pandit-avail-warning" style="display:none;margin-top:6px;padding:8px 10px;background:#ffebee;border:1px solid #ffcdd2;color:#c62828;border-radius:6px;font-size:12px;font-weight:700"></div>

          </div>
        </div>
        <button class="btn btn-gold" id="btn-submit-rebook" style="margin-top:16px;width:100%">
          <span class="material-icons">send</span> Confirm &amp; Schedule Ceremony
        </button>
      `, (m) => {
        const rbDateInput = m.querySelector('#rb-date');
        const rbPanditSelect = m.querySelector('#rb-pandit');
        const warningBox = m.querySelector('#rb-pandit-avail-warning');

        const refreshRebookPandits = () => {
          const chosenDate = rbDateInput.value;
          const currentVal = rbPanditSelect.value;
          let optsHtml = '<option value="">✨ Any Available Verified Pandit (Auto-assigned)</option>';
          eligiblePandits.forEach(p => {
            const servesTag = (!district || (p.workingDistricts || []).includes(district) || p.district === district) ? `Serves ${district || p.district}` : p.district;
            const avail = isPanditAvailableOnDate(p, chosenDate);
            optsHtml += `<option value="${esc(p.email)}" ${currentVal === p.email ? 'selected' : ''} ${!avail.available ? 'style="color:#c62828"' : ''}>Pt. ${esc(p.name)} (${esc(servesTag)}) — Dakshina: ${inr(p.fee)}${!avail.available ? ` [⚠️ NOT AVAILABLE: ${avail.reason}]` : ''}</option>`;
          });
          rbPanditSelect.innerHTML = optsHtml;
          checkSelectedPanditAvail();
        };

        const checkSelectedPanditAvail = () => {
          const chosenDate = rbDateInput.value;
          const pEmail = rbPanditSelect.value;
          if (!pEmail) {
            warningBox.style.display = 'none';
            return;
          }
          const p = eligiblePandits.find(x => x.email.toLowerCase() === pEmail.toLowerCase());
          if (p) {
            const avail = isPanditAvailableOnDate(p, chosenDate);
            if (!avail.available) {
              warningBox.style.display = 'block';
              warningBox.innerHTML = `⚠️ Pandit ${esc(p.name)} is not available on ${esc(chosenDate)} (${esc(avail.reason)}). Please pick an available Pandit.`;
            } else {
              warningBox.style.display = 'none';
            }
          }
        };

        rbDateInput.addEventListener('change', refreshRebookPandits);
        rbPanditSelect.addEventListener('change', checkSelectedPanditAvail);

        document.getElementById('btn-submit-rebook').onclick = async () => {
          const service = document.getElementById('rb-service').value;
          const dist = document.getElementById('rb-district').value.trim();
          const date = document.getElementById('rb-date').value;
          const time = document.getElementById('rb-time').value;
          const pEmail = document.getElementById('rb-pandit').value;
          const address = document.getElementById('rb-address').value.trim();

          if (!service || !dist || !date) return toast('Please fill required fields (Puja, District, Date)', true);

          if (pEmail) {
            const p = eligiblePandits.find(x => x.email.toLowerCase() === pEmail.toLowerCase());
            if (p) {
              const avail = isPanditAvailableOnDate(p, date);
              if (!avail.available) {
                return toast(`⚠️ Pandit ${p.name} is not available on ${date} (${avail.reason}). Please select another Pandit.`, true);
              }
            }
          }

          try {
            const newBooking = await api('/bookings', {
              method: 'POST',
              body: {
                userEmail: email,
                userName: name,
                phone: phone,
                service,
                district: dist,
                date,
                time,
                address,
                panditEmail: pEmail
              }
            });
            closeModal();
            toast(`Ceremony booked successfully! Booking ID: ${newBooking.bookingId || newBooking._id}`);
            await loadData();
            switchAdminTab('bookings');
          } catch (err) {
            toast('Booking failed: ' + err.message, true);
          }
        };

    // Helper: update district options based on selected state
    function onOfferStateChange(selectedState) {
      const distSelect = document.getElementById('mo-district');
      if (!distSelect) return;
      const dists = INDIAN_LOCATIONS[selectedState] || [];
      distSelect.innerHTML = `<option value="ALL">All Districts in ${selectedState === 'ALL' ? 'Selected State' : selectedState}</option>` +
        dists.map(d => `<option value="${esc(d)}">${esc(d)}</option>`).join('');
    }

    function onAnnouncementStateChange(selectedState) {
      const distSelect = document.getElementById('ann-district');
      if (!distSelect) return;
      const dists = INDIAN_LOCATIONS[selectedState] || [];
      distSelect.innerHTML = `<option value="ALL">All Districts in ${selectedState === 'ALL' ? 'Selected State' : selectedState}</option>` +
        dists.map(d => `<option value="${esc(d)}">${esc(d)}</option>`).join('');
    }

    function onAnnouncementAudienceChange(val) {
      const hint = document.getElementById('ann-pandit-hint');
      const mailLabel = document.getElementById('ann-mail-label');
      if (val === 'pandit') {
        if (hint) hint.style.display = 'block';
        if (mailLabel) mailLabel.innerHTML = '✉️ <b>Send Mail to All:</b> Broadcast this notice only to registered verified Pandits';
      } else {
        if (hint) hint.style.display = 'none';
        if (mailLabel) mailLabel.innerHTML = '✉️ <b>Send Mail to All:</b> Email this notice to all registered Devotees immediately';
      }
    }

    function handleFileToDataUrl(input, textInputId, previewContainerId) {
      if (!input.files || !input.files[0]) return;
      const file = input.files[0];
      const reader = new FileReader();
      reader.onload = (e) => {
        const dataUrl = e.target.result;
        const txtInput = document.getElementById(textInputId);
        if (txtInput) txtInput.value = dataUrl;
        updateBannerPreview(textInputId, previewContainerId);
      };
      reader.readAsDataURL(file);
    }

    function updateBannerPreview(textInputId, previewContainerId) {
      const txtInput = document.getElementById(textInputId);
      const container = document.getElementById(previewContainerId);
      if (!txtInput || !container) return;
      const val = txtInput.value.trim();
      if (val) {
        container.style.display = 'block';
        const img = container.querySelector('img');
        if (img) img.src = val;
      } else {
        container.style.display = 'none';
      }
    }

    function getFutureDateStr(daysAhead = 14) {
      const d = new Date();
      d.setDate(d.getDate() + daysAhead);
      return d.toISOString().split('T')[0];
    }

    // Submit Create Offer
    async function submitCreateOffer() {
      const title = (document.getElementById('mo-title')?.value || '').trim();
      const pujaName = document.getElementById('mo-puja')?.value || 'ALL';
      const discountPercent = Number(document.getElementById('mo-discount')?.value) || 0;
      const startDate = document.getElementById('mo-start-date')?.value;
      const endDate = document.getElementById('mo-end-date')?.value;
      const targetState = document.getElementById('mo-state')?.value || 'ALL';
      const targetDistVal = document.getElementById('mo-district')?.value || 'ALL';
      const description = (document.getElementById('mo-desc')?.value || '').trim();
      const bannerImage = (document.getElementById('mo-banner-url')?.value || '').trim();
      const sendMailToAll = Boolean(document.getElementById('mo-send-mail')?.checked);

      if (!title) return toast('Please enter an Offer Title / Headline', true);
      if (discountPercent <= 0 || discountPercent > 100) return toast('Please enter a valid discount percentage (1% to 100%)', true);
      if (!startDate || !endDate) return toast('Please select Start Date and Offer End Date', true);

      try {
        const payload = {
          title,
          pujaName,
          discountPercent,
          startDate,
          endDate,
          targetState,
          targetDistricts: targetDistVal === 'ALL' ? ['ALL'] : [targetDistVal],
          description,
          bannerImage,
          sendMailToAll
        };
        const res = await api('/admin/media/offers', {
          method: 'POST',
          body: payload
        });
        toast(res.message || 'Festive offer created successfully! 🪔');
        await loadData();
        renderActiveTab();
      } catch (err) {
        toast('Failed creating offer: ' + err.message, true);
      }
    }

    // Delete Offer
    async function deleteMediaOffer(offerId, title) {
      const ok = await adminConfirm({
        title: 'Remove Festive Offer',
        message: `Permanently remove "${title || offerId}"?`,
        detail: 'This offer will be removed immediately. The discount will no longer appear on Devotee Dashboards or be applied to new bookings.',
        confirmText: 'Remove Offer',
        confirmClass: 'btn-red',
        icon: 'delete_forever'
      });
      if (!ok) return;

      try {
        await api('/admin/media/offers/' + encodeURIComponent(offerId), { method: 'DELETE' });
        toast('Festive offer removed successfully.');
        await loadData();
        renderActiveTab();
      } catch (err) {
        toast('Error removing offer: ' + err.message, true);
      }
    }

    // Set Offer Status
    async function setOfferStatus(offerId, status) {

        await api('/admin/media/offers/' + encodeURIComponent(offerId) + '/status', {
          method: 'PUT',
          body: { status }
        });
        toast(`Offer marked as ${status}`);
        await loadData();
        renderActiveTab();
      } catch (err) {
        toast('Error updating status: ' + err.message, true);

    // Send / Broadcast Offer Email
    async function triggerSendOfferEmail(offerId) {
      const ok = await adminConfirm({
        title: 'Broadcast Festive Offer Email',
        message: 'Send this festive offer email to all registered devotees in the target state / district?',
        detail: 'All matching active devotees will receive a sacred Vedic invitation with your discount details and banner.',
        confirmText: 'Send Broadcast Email',
        confirmClass: 'btn-gold',
        icon: 'send'
      });

      try {

        renderActiveTab();
      } catch (err) {
        toast('Broadcast email failed: ' + err.message, true);

    // Submit Create Announcement
    async function submitCreateAnnouncement() {
      const title = (document.getElementById('ann-title')?.value || '').trim();
      const audienceType = document.getElementById('ann-audience')?.value || 'user';
      const targetState = document.getElementById('ann-state')?.value || 'ALL';
      const targetDistVal = document.getElementById('ann-district')?.value || 'ALL';
      const startDate = document.getElementById('ann-start-date')?.value;
      const endDate = document.getElementById('ann-end-date')?.value;
      const content = (document.getElementById('ann-content')?.value || '').trim();
      const bannerImage = (document.getElementById('ann-banner-url')?.value || '').trim();
      const sendMailToAll = Boolean(document.getElementById('ann-send-mail')?.checked);

      if (!title) return toast('Please enter Announcement Title', true);
      if (!content) return toast('Please enter Announcement content', true);

      try {
        const res = await api('/admin/media/announcements', {
          method: 'POST',
          body: {
            title,
            audienceType,
            targetState,
            targetDistricts: targetDistVal === 'ALL' ? ['ALL'] : [targetDistVal],
            startDate,
            endDate,
            content,
            bannerImage,
            sendMailToAll
          }
        });
        toast(res.message || 'Announcement published successfully! 📢');
        await loadData();
        renderActiveTab();
      } catch (err) {
        toast('Failed publishing announcement: ' + err.message, true);
      }

    // Quick prefill offer form for state/district
    function quickCreateOfferForRegion(state, district) {
      PREFILLED_REGION = { state, district: district || 'ALL' };
      setMediaSubtab('offers');
      setTimeout(() => {
        const stSelect = document.getElementById('mo-state');
        if (stSelect) {
          stSelect.value = state;
          onOfferStateChange(state);
        }
        const distSelect = document.getElementById('mo-district');
        if (distSelect && district) {
          distSelect.value = district;
        }
        window.scrollTo({ top: 300, behavior: 'smooth' });
      }, 50);
    }

    // Copy district emails
    function copyDistrictEmails(state, district) {
      const statesMap = (S.mediaDevotees && S.mediaDevotees.states) || {};
      const devList = (statesMap[state] && statesMap[state].districts && statesMap[state].districts[district]) || [];
      const emails = devList.map(u => u.email).filter(Boolean);
      if (!emails.length) return toast('No devotee emails found in ' + district, true);
      navigator.clipboard.writeText(emails.join(', '));

        </button>
      `, (m) => {
        let curSlots = [...(Array.isArray(p.timeSlots) && p.timeSlots.length ? p.timeSlots : ['06:00 AM - 09:00 AM', '09:00 AM - 12:00 PM', '01:00 PM - 04:00 PM', '04:00 PM - 07:00 PM', '07:00 PM - 10:00 PM'])];
        const chipsContainer = m.querySelector('#adm-slots-chips');

        function renderAdmSlots() {
          if (!chipsContainer) return;
          if (!curSlots.length) {
            chipsContainer.innerHTML = '<span class="muted" style="font-size:12px">No slots configured. Use preset buttons above or add custom slots.</span>';
            return;
          }
          chipsContainer.innerHTML = curSlots.map((s, idx) => `
            <span style="display:inline-flex;align-items:center;gap:6px;background:#fff;border:1.5px solid #ebd9c2;border-radius:20px;padding:4px 10px;font-size:12px;font-weight:700;color:var(--admin-dark)">
              <span class="material-icons" style="font-size:14px;color:var(--admin-gold)">schedule</span>
              <span>${esc(s)}</span>
              <button type="button" data-adm-slot-idx="${idx}" class="adm-slot-del" style="background:none;border:none;padding:0;cursor:pointer;color:#c62828;display:flex;align-items:center" title="Remove slot">
                <span class="material-icons" style="font-size:14px">close</span>
              </button>
            </span>
          `).join('');

          chipsContainer.querySelectorAll('.adm-slot-del').forEach(delBtn => {
            delBtn.onclick = () => {
              const i = Number(delBtn.dataset.admSlotIdx);
              curSlots.splice(i, 1);
              renderAdmSlots();
            };
          });
        }

        renderAdmSlots();

        const btnStd = m.querySelector('#btn-adm-slots-standard');
        if (btnStd) {
          btnStd.onclick = () => {
            curSlots = ['06:00 AM - 09:00 AM', '09:00 AM - 12:00 PM', '01:00 PM - 04:00 PM', '04:00 PM - 07:00 PM', '07:00 PM - 10:00 PM'];
            renderAdmSlots();
          };
        }
        const btnMorn = m.querySelector('#btn-adm-slots-morning');
        if (btnMorn) {
          btnMorn.onclick = () => {
            curSlots = ['06:00 AM - 09:00 AM', '09:00 AM - 12:00 PM'];
            renderAdmSlots();
          };
        }
        const btnEve = m.querySelector('#btn-adm-slots-evening');
        if (btnEve) {
          btnEve.onclick = () => {
            curSlots = ['04:00 PM - 07:00 PM', '07:00 PM - 10:00 PM'];
            renderAdmSlots();
          };
        }

        const addSlotBtn = m.querySelector('#btn-adm-add-slot');
        const newSlotInp = m.querySelector('#adm-new-slot-input');
        if (addSlotBtn && newSlotInp) {
          const doAdd = () => {
            const val = newSlotInp.value.trim();
            if (!val) return toast('Please enter a time slot (e.g. 06:30 AM - 09:30 AM)', true);
            if (curSlots.includes(val)) return toast('Time slot already added', true);
            curSlots.push(val);
            newSlotInp.value = '';
            renderAdmSlots();
          };
          addSlotBtn.onclick = doAdd;
          newSlotInp.onkeydown = (e) => { if (e.key === 'Enter') { e.preventDefault(); doAdd(); } };
        }

        // Instant visual feedback when admin types in amounts
        m.querySelectorAll('.adm-dist-fee-input').forEach(inp => {
          inp.addEventListener('input', () => {
            const val = Number(inp.value);
            const card = inp.closest('.district-pricing-card');
            const badge = card ? card.querySelector('.dist-status-badge') : null;
            const note = card ? card.querySelector('.dist-status-note') : null;
            if (val > 0) {
              inp.style.borderColor = '#81c784';
              inp.style.background = '#f1f8e9';
              if (badge) {
                badge.className = 'badge green dist-status-badge';
                badge.style.background = '#2e7d32';
                badge.style.color = '#fff';
                badge.textContent = `Set: ₹${val}`;
              }
              if (note) {
                note.style.color = '#2e7d32';
                note.textContent = `Dakshina ₹${val} typed · Ready to save, unlock region & notify 404 users.`;
              }
            } else {
              inp.style.borderColor = '#ef9a9a';
              inp.style.background = '#fff';
              if (badge && (!curPrices[inp.dataset.district] || Number(curPrices[inp.dataset.district]) <= 0)) {
                badge.className = 'badge dist-status-badge';
                badge.style.background = '#d32f2f';
                badge.style.color = '#fff';
                badge.textContent = 'NEW';
              }
              if (note && (!curPrices[inp.dataset.district] || Number(curPrices[inp.dataset.district]) <= 0)) {
                note.style.color = '#c62828';
                note.textContent = 'Rate: ₹00 (New District) · Please type amount to unlock region & notify 404 devotees.';
              }
            }
          });
        });

        const quickInput = m.querySelector('#quick-adm-dist-fee');
        const quickBtn = m.querySelector('#btn-quick-fill-adm');
        if (quickBtn && quickInput) {
          quickBtn.onclick = () => {
            const val = Number(quickInput.value);
            if (!val || val <= 0) return toast('Please enter a valid amount', true);
            m.querySelectorAll('.adm-dist-fee-input').forEach(inp => {
              inp.value = val;
              inp.dispatchEvent(new Event('input'));
            });
            toast(`Set ₹${val} for all ${districts.length} districts`);
          };
        }

        const saveBtn = m.querySelector('#btn-save-dist-prices');
        if (saveBtn) {
          saveBtn.onclick = async () => {
            const baseFee = Number(m.querySelector('#adm-base-fee').value) || 1500;
            const prices = {};
            m.querySelectorAll('.adm-dist-fee-input').forEach(inp => {
              const d = inp.dataset.district;
              const val = Number(inp.value) || 0;
              prices[d] = val;
            });

            if (!curSlots.length) return toast('Please configure at least one ritual time slot', true);

            // Optimistically update in memory immediately so UI does not hang or lag
            p.fee = baseFee;
            p.districtPrices = { ...(p.districtPrices || {}), ...prices };
            p.timeSlots = curSlots;
            p.status = 'Verified';
            p.verified = true;
            closeModal();
            toast(`District pricing & ritual time slots saved for ${p.name}! Daily time slots notification emailed to Pandit.`);
            renderActiveTab();

            // Run backend API update and refresh in background
            api(`/pandits/${p._id}/district-prices`, {
              method: 'PUT',
              body: { fee: baseFee, districtPrices: prices, timeSlots: curSlots }
            }).then(() => {
              loadData();
            }).catch(err => {
              toast(err.message || 'Failed saving district prices', true);
              loadData();
            });
          };
        }
      });
    }

      const isRejected = ['Rejected', 'Declined', 'Rejected by Pandit'].includes(l.status);
      const eligible = S.adminPandits.filter((p) => p.verified && ((p.workingDistricts || []).includes(l.district) || p.district === l.district));
      const list = eligible.length ? eligible : S.adminPandits.filter((p) => p.verified);

      openModal((isRejected ? 'Re-assign Pandits – ' : 'Assign Pandits – ') + l.pujaName, `

          <div style="background:#ffebee;border:1.5px solid #ef9a9a;color:#b71c1c;padding:10px 14px;border-radius:8px;margin-bottom:12px;font-size:13px;line-height:1.5">

          <div style="margin-top:2px">👥 <b>Team Required:</b> ${l.requiredPandits} Pandit(s)</div>
        </div>
        <div class="checks" style="max-height:260px;overflow-y:auto;display:flex;flex-direction:column;gap:8px">
          ${list.map((p) => {

            const isPrevReject = panditSt === 'Rejected' || panditSt === 'Declined';
            const avail = isPanditAvailableOnDate(p, l.fromDate);
            const isUnavail = !avail.available;
            return `<label class="check" style="${isPrevReject || isUnavail ? 'opacity:0.75;background:#fff5f5;' : ''}">
              <input type="checkbox" name="as-p" value="${esc(p.email)}" data-unavail="${isUnavail ? '1' : '0'}" data-unavail-reason="${esc(avail.reason)}" data-pandit-name="${esc(p.name)}" ${(wasAssigned && !isPrevReject && !isUnavail) ? 'checked' : ''}>
              <b>${esc(p.name)}</b> — ${esc(p.district)} (${esc(p.exp)})
              ${isPrevReject ? '<span style="color:#c62828;font-size:11px;font-weight:700;margin-left:6px">(Previously Declined)</span>' : ''}
              ${isUnavail ? `<span style="color:#c62828;font-size:11px;font-weight:700;margin-left:6px">⚠️ (Not Available that day: ${esc(avail.reason)})</span>` : ''}
            </label>`;
          }).join('') || '<p class="muted">No verified Pandits available for this district.</p>'}

        <button class="btn btn-gold" id="btn-save-assign" style="margin-top:14px;width:100%">${isRejected ? 'Confirm & Send New Assignment Offer' : 'Save Assignment & Notify Pandit'}</button>`, (m) => {

          const checkedInps = [...m.querySelectorAll('input[name="as-p"]:checked')];
          if (!checkedInps.length) return toast('Select at least one Pandit', true);
          const unavailInp = checkedInps.find(x => x.dataset.unavail === '1');
          if (unavailInp) {
            return toast(`⚠️ Pandit ${unavailInp.dataset.panditName} is not available on ${l.fromDate} (${unavailInp.dataset.unavailReason}). Please uncheck this Pandit.`, true);

          const emails = checkedInps.map((i) => i.value);

            toast('Pandits assigned successfully & notification emails sent');
            loadData();
          } catch (e) { toast(e.message, true); }
        };
      });
    }

          reader.onload = (evt) => {
            uploadedImageData = evt.target.result;

            const previewTag = document.getElementById('ep-preview-tag');
            if (previewTag && preview) {
              previewTag.src = uploadedImageData;
              preview.style.display = 'block';

          reader.readAsDataURL(file);
        };

          const base = type === 'Short' ? +document.getElementById('ep-base').value || 1199 : 0;
          const hr = type === 'Long' ? +document.getElementById('ep-hr').value || 500 : 0;
          const name = document.getElementById('ep-name').value.trim();
          const desc = document.getElementById('ep-desc').value.trim();
          if (!name || !desc) return toast('Name and description are required', true);

          const body = {
            name,
            type,
            desc,
            longDesc: document.getElementById('ep-long').value.trim(),
            benefits: document.getElementById('ep-ben').value.split(',').map((s) => s.trim()).filter(Boolean),
            baseFee: base,
            perHourFee: hr,
            price: type === 'Long' ? `From ${inr(hr)}/hr` : inr(base)
          };

          try {
            await api('/pujas', { method: 'POST', body });
            closeModal();
            toast('Puja service updated and saved to database! 🙏');
            loadData();
          } catch (e) { toast(e.message, true); }
        };
      });
    }

    async function verifyBookingPayment(id) {
      const isLong = String(id).startsWith('LP-') || String(id).startsWith('LONG-') || (S.adminLongs || []).some(x => x.id === id);
      const confirmed = await adminConfirm({
        title: 'Verify & Confirm Payment',
        message: `Verify payment for ${isLong ? 'multi-day ceremony' : 'booking'} ${id} and issue official bill?`,
        detail: 'This will officially verify the devotee payment, generate the downloadable Dakshina bill/receipt, and update the ceremony record.',
        confirmText: 'Verify & Issue Bill',
        confirmClass: 'btn-green',
        icon: 'verified'
      });
      if (!confirmed) return;

      try {
        if (isLong) {
          await api('/long-puja-requests/' + encodeURIComponent(id) + '/verify-payment', { method: 'POST' });
        } else {
          await api('/bookings/' + encodeURIComponent(id) + '/verify-payment', { method: 'POST' });
        }
        toast('Payment verified! Bill issued and records updated. 🙏');
        loadData();
      } catch (e) {
        toast(e.message, true);
      }
    }

    async function rejectBookingPayment(id) {
      const isLong = String(id).startsWith('LP-') || String(id).startsWith('LONG-') || (S.adminLongs || []).some(x => x.id === id);
      const defaultReason = 'Transaction reference could not be verified in bank records';
      const reason = await adminPrompt({
        title: 'Reject Payment Verification',
        message: `Rejecting payment proof for ${isLong ? 'multi-day ceremony' : 'booking'} ${id}`,
        label: 'Rejection Reason (will be emailed to devotee)',
        placeholder: 'e.g. Invalid UTR / unconfirmed credit',
        defaultValue: defaultReason,
        confirmText: 'Reject Payment',
        confirmClass: 'btn-red',
        icon: 'cancel'
      });
      if (reason === null) return;

      try {
        if (isLong) {
          await api('/long-puja-requests/' + encodeURIComponent(id) + '/reject-payment', {
            method: 'POST',
            body: { reason: reason.trim() || defaultReason }
          });
        } else {
          await api('/bookings/' + encodeURIComponent(id) + '/reject-payment', {
            method: 'POST',
            body: { reason: reason.trim() || defaultReason }
          });
        }
        toast('Payment marked as Rejected. Devotee notified to re-submit valid proof.');
        loadData();
      } catch (e) {
        toast(e.message, true);
      }
    }

            return `
              ${getBulkBarHtml('payments', 'Payment Record', 'deleteSelectedPayments')}
              <div class="table-responsive">
                <table class="admin-table">
                  <thead>
                    <tr>
                      <th class="th-cb"><input type="checkbox" ${allPaymentsSelected ? 'checked' : ''} onchange="toggleSelectAll('payments', this.checked, [${visiblePaymentIds.map(id => `'${esc(id)}'`).join(',')}])" title="Select All Payments"></th>

                      <th>Devotee Details</th>
                      <th>Assigned Pandit</th>

                      const isPending = b.paymentStatus === 'Under Processing' || b.paymentStatus === 'Verification Pending';

                            ` : '<span class="muted">No proof submitted</span>'}
                          </td>
                          <td>
                            ${isRefunded ? '<span class="badge green">Refunded ✅</span>' :
                              isPendingRefund ? '<span class="badge red" style="background:#ffebee;color:#c62828;border:1px solid #ef9a9a">Pending Refund</span>' :
                              isPaid ? '<span class="badge green">Paid &amp; Verified</span>' :
                              isPending ? '<span class="badge amber" style="background:#fff3e0;border:1px solid #ffb74d;color:#e65100">Under Processing</span>' :
                              isRejected ? `<span class="badge red" style="background:#ffebee;color:#c62828;border:1px solid #ef9a9a">Payment Rejected</span>${b.paymentRejectionReason ? `<br><small class="muted" style="color:#c62828;font-size:11px">Reason: ${esc(b.paymentRejectionReason)}</small>` : ''}` :
                              '<span class="badge">' + esc(b.paymentStatus || 'Pending') + '</span>'}
                          </td>
                          <td>
                            <div style="display:flex;gap:6px;flex-wrap:wrap">
                              ${isPending ? `
                                <button class="btn btn-green btn-sm" onclick="verifyBookingPayment('${esc(b.bookingId)}')">

                                </button>

                                <button class="btn btn-gold btn-sm" onclick="openAdminProcessRefundModal('${esc(b.bookingId)}')">
                                  <span class="material-icons" style="font-size:14px">payments</span> Refund (${inr(b.refundAmount)})
                                </button>
                              ` : isRefunded ? `
                                <button class="btn btn-outline dark btn-sm" onclick="openAdminProcessRefundModal('${esc(b.bookingId)}', true)">

                                </button>
                              ` : ''}

                          </td>
                        </tr>
                      `;

                  </tbody>
                </table>
              </div>
            `;

    async function deleteBookingPayment(bookingId) {
      const ok = await adminConfirm({
        title: 'Delete Payment Record',
        message: `Delete payment record for booking ${bookingId}?`,
        detail: 'This will permanently remove the booking and its corresponding payment verification record from the ledger. This action cannot be undone.',
        confirmText: 'Delete Payment Record',
        confirmClass: 'btn-red',
        icon: 'delete_forever'
      });
      if (!ok) return;

      try {
        await api('/bookings/' + encodeURIComponent(bookingId), { method: 'DELETE' });
        S.bookings = (S.bookings || []).filter(x => x.bookingId !== bookingId && x._id !== bookingId);
        SELECTED.payments.delete(bookingId);
        SELECTED.bookings.delete(bookingId);
        toast(`Payment record for booking ${bookingId} deleted successfully`);
        renderKpis();
        renderActiveTab();
      } catch (e) {
        toast('Error deleting payment record: ' + e.message, true);
      }
    }

    async function deleteSelectedPayments() {
      const ids = Array.from(SELECTED.payments);
      if (!ids.length) return;
      const ok = await adminConfirm({
        title: 'Bulk Delete Payment Records',
        message: `Permanently delete ${ids.length} selected payment record(s)?`,
        detail: 'All selected payment verification entries and their linked ceremony bookings will be permanently removed. This action cannot be undone.',
        confirmText: `Delete ${ids.length} Records`,
        confirmClass: 'btn-red',
        icon: 'delete_sweep'
      });
      if (!ok) return;

      try {
        const res = await api('/bookings/bulk-delete', { method: 'POST', body: { ids } });
        const idSet = new Set(ids);
        S.bookings = (S.bookings || []).filter(b => !idSet.has(b.bookingId) && !idSet.has(b._id));
        SELECTED.payments.clear();
        ids.forEach(id => SELECTED.bookings.delete(id));
        toast(`${res.count || ids.length} payment record(s) deleted successfully`);
        renderKpis();
        renderActiveTab();
      } catch (e) {
        toast('Error in bulk delete: ' + e.message, true);
      }
    }

    let PANDIT_PAYOUT_SEARCH = '';

    function setPanditPayoutFilter(f) {
      PANDIT_PAYOUT_FILTER = f;
      renderPanditPaymentsSection(document.getElementById('admin-view-root'));
    }
