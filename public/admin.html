<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PujaConnect – Super Admin Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  <style>
    body { background: #fbf7f0; color: #2e1c12; }
    .admin-header {
      background: #351605;
      color: #fff;
      padding: 14px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 4px 20px rgba(0,0,0,0.15);
      position: sticky;
      top: 0;
      z-index: 50;
    }
    .admin-title {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 18px;
      font-weight: 700;
      color: #ffd88a;
    }
    .admin-title .om { font-size: 24px; color: #d99a19; }
    .admin-controls { display: flex; align-items: center; gap: 14px; }
    .db-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      transition: all 0.3s ease;
    }
    .db-badge.connected {
      background: rgba(76, 175, 80, 0.18);
      border: 1px solid #4caf50;
      color: #81c784;
    }
    .db-badge.disconnected {
      background: rgba(244, 67, 54, 0.2);
      border: 1px solid #f44336;
      color: #e57373;
    }
    .pulse-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: currentColor;
      box-shadow: 0 0 8px currentColor;
    }
    .main-admin { max-width: 1200px; margin: 30px auto; padding: 0 20px 60px; }
    .table-avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #d99a19;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
  </style>
</head>
<body>
  <header class="admin-header">
    <div class="admin-title">
      <span class="om">ॐ</span>
      <span>PujaConnect Admin Portal</span>
      <span class="role-badge" style="background:#55280b;border-color:#d99a19;color:#ffd88a;font-size:11px">Super Admin</span>
    </div>
    <div class="admin-controls">
      <div id="admin-db-badge" class="db-badge connected">
        <span class="pulse-dot"></span>
        <span id="admin-db-text">Checking Database...</span>
      </div>
      <button class="btn btn-outline" id="btn-refresh-db" style="padding:6px 12px;font-size:12px;color:#ffd88a;border-color:#ffd88a"><span class="material-icons" style="font-size:14px;vertical-align:middle">sync</span> Re-check DB</button>
      <a href="/" class="btn btn-gold" style="padding:6px 14px;font-size:13px;text-decoration:none"><span class="material-icons" style="font-size:16px;vertical-align:middle">public</span> View Public Website</a>
    </div>
  </header>

  <main class="main-admin">
    <div id="admin-content">
      <div class="empty">Loading Super Admin Dashboard…</div>
    </div>
  </main>

  <div id="modal-root"></div>
  <div id="toast" class="toast"></div>

  <script>
    let TOKEN = '';
    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const inr = (n) => '₹' + Number(n || 0).toLocaleString('en-IN');

    function toast(msg, isErr) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.className = 'toast show' + (isErr ? ' error' : '');
      clearTimeout(toast._t);
      toast._t = setTimeout(() => (t.className = 'toast'), 3500);
    }

    async function api(path, { method = 'GET', body } = {}) {
      const res = await fetch('/api' + path, {
        method,
        headers: {
          'Content-Type': 'application/json',
          ...(TOKEN ? { Authorization: 'Bearer ' + TOKEN } : {})
        },
        body: body ? JSON.stringify(body) : undefined
      });
      let data = null;
      try { data = await res.json(); } catch {}
      if (!res.ok) throw new Error((data && data.error) || 'Request failed (' + res.status + ')');
      return data;
    }

    function openModal(title, html, onMount) {
      document.getElementById('modal-root').innerHTML = `
        <div class="modal-backdrop" onclick="if(event.target===this)closeModal()">
          <div class="modal">
            <div class="modal-head">
              <h3>${esc(title)}</h3>
              <button onclick="closeModal()" aria-label="Close"><span class="material-icons">close</span></button>
            </div>
            <div class="modal-body">${html}</div>
          </div>
        </div>`;
      if (onMount) onMount(document.querySelector('.modal'));
    }
    function closeModal() { document.getElementById('modal-root').innerHTML = ''; }

    function statusBadge(s) {
      const cls = { 'Verified': 'badge-green', 'Pending Review': 'badge-gold', 'Rejected': 'badge-red', 'Confirmed': 'badge-green', 'Completed': 'badge-green', 'Cancelled': 'badge-red', 'Assigned': 'badge-green' }[s] || 'badge-gold';
      return `<span class="badge ${cls}">${esc(s)}</span>`;
    }

    async function checkDb() {
      const badge = document.getElementById('admin-db-badge');
      const text = document.getElementById('admin-db-text');
      try {
        const d = await api('/db-status');
        if (d.connected) {
          badge.className = 'db-badge connected';
          text.textContent = 'MongoDB Connected 🟢 (' + (d.host || 'Atlas') + ')';
        } else {
          badge.className = 'db-badge disconnected';
          text.textContent = 'Database Disconnected 🔴';
        }
      } catch (e) {
        badge.className = 'db-badge disconnected';
        text.textContent = 'Database Disconnected 🔴';
      }
    }

    let S = { adminPandits: [], adminLongs: [], pujas: [] };

    async function renderDashboard() {
      await checkDb();
      const root = document.getElementById('admin-content');
      try {
        const [stats, pandits, longs, users, pujas] = await Promise.all([
          api('/admin/stats').catch(() => ({ users: 0, pandits: 0, verifiedPandits: 0, pendingPandits: 0, bookings: 0, completed: 0, revenue: 0, longRequests: 0, pendingLong: 0 })),
          api('/pandits').catch(() => []),
          api('/long-puja-requests').catch(() => []),
          api('/users').catch(() => []),
          api('/pujas').catch(() => [])
        ]);
        S.adminPandits = pandits; S.adminLongs = longs; S.pujas = pujas;
        const pend = pandits.filter((p) => p.status === 'Pending Review');
        const unassigned = longs.filter((l) => l.status === 'Pending Admin');

        root.innerHTML = `
          <div class="stats">${[['Devotees', stats.users], ['Total Pandits', stats.pandits], ['Verified Pandits', stats.verifiedPandits], ['Pending KYC Review', stats.pendingPandits], ['Total Bookings', stats.bookings], ['Completed Ceremonies', stats.completed], ['Booked Dakshina', inr(stats.revenue)], ['Multi-Day Requests', `${stats.pendingLong}/${stats.longRequests}`]].map(([k, v]) => `<div class="stat"><b>${v}</b><span>${k}</span></div>`).join('')}</div>

          <div class="panel">
            <div class="row">
              <h3>Pandit KYC Verification Queue</h3>
              ${pend.length ? `<span class="badge badge-gold">${pend.length} awaiting review</span>` : ''}
            </div>
            ${pend.length ? `<table>
              <tr><th>Photo</th><th>Pandit Details</th><th>Home District</th><th>Dakshina</th><th>Specialty</th><th>Action</th></tr>
              ${pend.map((p) => `<tr>
                <td><img src="${esc(p.photo || 'https://images.unsplash.com/photo-1544168190-79c15427015f?auto=format&fit=crop&q=80&w=200')}" class="table-avatar" alt="Pandit"></td>
                <td><b>${esc(p.name)}</b><br><small class="muted">${esc(p.email)} · 📞 ${esc(p.phone)}</small></td>
                <td>${esc(p.district || p.location)}</td>
                <td>${inr(p.fee)}</td>
                <td><small>${esc(p.specialty || (p.services || []).join(', ') || 'Vedic Rituals')}</small></td>
                <td>
                  <button class="btn btn-green btn-sm" onclick="setPanditStatus('${esc(p._id)}', 'Verified')">Approve</button>
                  <button class="btn btn-red btn-sm" onclick="setPanditStatus('${esc(p._id)}', 'Rejected')">Reject</button>
                </td>
              </tr>`).join('')}
            </table>` : '<p class="muted" style="padding:10px 0">All Pandits are verified. No registrations currently pending review.</p>'}
          </div>

          <div class="panel">
            <div class="row">
              <h3>Multi-Day Puja Custom Requests</h3>
              ${unassigned.length ? `<span class="badge badge-red">${unassigned.length} need Pandit assignment</span>` : ''}
            </div>
            ${longs.length ? `<table>
              <tr><th>ID</th><th>Devotee</th><th>Ritual</th><th>Dates &amp; Duration</th><th>Pandits Assigned</th><th>Status</th><th>Action</th></tr>
              ${longs.map((l) => `<tr>
                <td><b>${esc(l.id)}</b></td>
                <td>${esc(l.userName)}<br><small class="muted">${esc(l.userEmail)}</small></td>
                <td>${esc(l.pujaName)}<br><small>${esc(l.district)}</small></td>
                <td>${esc(l.fromDate)} → ${esc(l.toDate)}<br><small class="muted">${l.totalDays} days × ${l.dailyHours} hrs/day</small></td>
                <td>${l.assignedPandits.length}/${l.requiredPandits}</td>
                <td>${statusBadge(l.status)}</td>
                <td>
                  ${['Pending Admin', 'Assigned'].includes(l.status) ? `<button class="btn btn-dark btn-sm" onclick="openAssignModal('${esc(l.id)}')">${l.status === 'Assigned' ? 'Re-assign' : 'Assign Pandits'}</button>` : '—'}
                </td>
              </tr>`).join('')}
            </table>` : '<p class="muted">No custom multi-day puja requests yet.</p>'}
          </div>

          <div class="panel">
            <div class="row">
              <h3>Puja Services Catalog</h3>
              <button class="btn btn-gold btn-sm" onclick="openPujaModal('')"><span class="material-icons" style="font-size:16px;vertical-align:middle">add</span> Add Puja</button>
            </div>
            <table>
              <tr><th>Name</th><th>Type</th><th>Dakshina</th><th>Description</th><th>Action</th></tr>
              ${pujas.map((p) => `<tr>
                <td><b>${esc(p.name)}</b></td>
                <td><span class="badge ${p.type === 'Long' ? 'badge-gold' : 'badge-green'}">${esc(p.type)}</span></td>
                <td><b>${p.type === 'Long' ? inr(p.perHourFee) + '/hr' : inr(p.baseFee)}</b></td>
                <td><small>${esc(p.desc)}</small></td>
                <td>
                  <button class="btn btn-outline dark btn-sm" onclick="openPujaModal('${esc(p._id)}')">Edit</button>
                  <button class="btn btn-red btn-sm" onclick="deletePuja('${esc(p._id)}')">Delete</button>
                </td>
              </tr>`).join('')}
            </table>
          </div>

          <div class="panel">
            <h3>Registered Pandits Directory</h3>
            <table>
              <tr><th>Photo</th><th>Pandit Name</th><th>Home District</th><th>Experience</th><th>Base Dakshina</th><th>Status</th></tr>
              ${pandits.map((p) => `<tr>
                <td><img src="${esc(p.photo || 'https://images.unsplash.com/photo-1544168190-79c15427015f?auto=format&fit=crop&q=80&w=200')}" class="table-avatar" style="width:36px;height:36px" alt="Avatar"></td>
                <td><b>${esc(p.name)}</b><br><small class="muted">${esc(p.email)} · 📞 ${esc(p.phone)}</small></td>
                <td>${esc(p.district || p.location)}</td>
                <td>${esc(p.exp || p.experience + ' Years')}</td>
                <td>${inr(p.fee)}</td>
                <td>${statusBadge(p.status)}</td>
              </tr>`).join('')}
            </table>
          </div>

          <div class="panel">
            <h3>Registered Devotees</h3>
            ${users.length ? `<table>
              <tr><th>Devotee Name</th><th>Email</th><th>Phone</th><th>Location</th><th>Registration Date</th></tr>
              ${users.map((u) => `<tr>
                <td><b>${esc(u.name)}</b></td>
                <td>${esc(u.email)}</td>
                <td>${esc(u.phone)}</td>
                <td>${esc(u.district || u.city || '')}${u.state ? ', ' + esc(u.state) : ''}</td>
                <td>${new Date(u.createdAt).toLocaleDateString()}</td>
              </tr>`).join('')}
            </table>` : '<p class="muted">No devotees registered yet.</p>'}
          </div>
        `;
      } catch (e) {
        root.innerHTML = `<div class="empty error">Error loading admin dashboard: ${esc(e.message)}</div>`;
      }
    }

    async function setPanditStatus(id, status) {
      try {
        await api(`/pandits/${id}/status`, { method: 'PUT', body: { status } });
        toast(`Pandit ${status.toLowerCase()} successfully!`);
        renderDashboard();
      } catch (e) { toast(e.message, true); }
    }

    async function deletePuja(id) {
      if (!confirm('Are you sure you want to delete this puja from the catalog?')) return;
      try {
        await api(`/pujas/${id}`, { method: 'DELETE' });
        toast('Puja deleted from catalog');
        renderDashboard();
      } catch (e) { toast(e.message, true); }
    }

    function openAssignModal(id) {
      const l = S.adminLongs.find((x) => x.id === id);
      const eligible = S.adminPandits.filter((p) => p.verified && ((p.workingDistricts || []).includes(l.district) || p.district === l.district));
      const list = eligible.length ? eligible : S.adminPandits.filter((p) => p.verified);
      openModal('Assign Pandits – ' + l.pujaName, `
        <p>Assign up to <b>${l.requiredPandits}</b> Pandits for this ${l.totalDays}-day ritual in <b>${esc(l.district)}</b>.</p>
        <div class="checks" style="max-height:260px;overflow-y:auto;display:flex;flex-direction:column;gap:8px">
          ${list.map((p) => `<label class="check"><input type="checkbox" name="as-p" value="${esc(p.email)}" ${(l.assignedPandits || []).includes(p.email) ? 'checked' : ''}> <b>${esc(p.name)}</b> — ${esc(p.district)} (${esc(p.exp)})</label>`).join('') || '<p class="muted">No verified Pandits available.</p>'}
        </div>
        <button class="btn btn-gold" id="btn-save-assign" style="margin-top:14px;width:100%">Save Assignment</button>`, (m) => {
        document.getElementById('btn-save-assign').onclick = async () => {
          const emails = [...m.querySelectorAll('input[name="as-p"]:checked')].map((i) => i.value);
          if (!emails.length) return toast('Select at least one Pandit', true);
          try {
            await api(`/long-puja-requests/${id}/assign`, { method: 'PUT', body: { panditEmails: emails } });
            closeModal();
            toast('Pandits assigned successfully');
            renderDashboard();
          } catch (e) { toast(e.message, true); }
        };
      });
    }

    function openPujaModal(id) {
      const p = id ? S.pujas.find((x) => x._id === id) : null;
      openModal(p ? 'Edit Puja Service' : 'Add New Puja Service', `
        <div><label>Puja Name</label><input id="ep-name" value="${esc(p ? p.name : '')}"></div>
        <div><label>Type</label><select id="ep-type"><option value="Short" ${p && p.type === 'Short' ? 'selected' : ''}>Short (Single-session home puja)</option><option value="Long" ${p && p.type === 'Long' ? 'selected' : ''}>Long (Multi-day Mahayajna)</option></select></div>
        <div class="form-grid" style="padding:0">
          <div><label>Base Fee (₹)</label><input id="ep-base" type="number" value="${p ? p.baseFee || 0 : 1999}"></div>
          <div><label>Per Hour Fee for Multi-Day (₹)</label><input id="ep-hr" type="number" value="${p ? p.perHourFee || 0 : 600}"></div>
        </div>
        <div><label>Short Description</label><input id="ep-desc" value="${esc(p ? p.desc : '')}"></div>
        <div><label>Detailed Description</label><textarea id="ep-long" rows="2">${esc(p ? p.longDesc : '')}</textarea></div>
        <div><label>Benefits (comma-separated)</label><input id="ep-ben" value="${esc((p && p.benefits || []).join(', '))}"></div>
        <div><label>Image URL</label><input id="ep-img" value="${esc(p ? p.image : '')}"></div>
        <button class="btn btn-gold" id="ep-save" style="margin-top:10px;width:100%">Save Puja</button>`, (m) => {
        document.getElementById('ep-save').onclick = async () => {
          const type = document.getElementById('ep-type').value;
          const base = +document.getElementById('ep-base').value;
          const hr = +document.getElementById('ep-hr').value;
          const body = {
            name: document.getElementById('ep-name').value.trim(),
            type,
            desc: document.getElementById('ep-desc').value,
            longDesc: document.getElementById('ep-long').value,
            benefits: document.getElementById('ep-ben').value.split(',').map((s) => s.trim()).filter(Boolean),
            baseFee: base,
            perHourFee: hr,
            price: type === 'Long' ? `From ${inr(hr)}/hr` : inr(base)
          };
          if (document.getElementById('ep-img').value) body.image = document.getElementById('ep-img').value;
          if (!body.name || !body.desc) return toast('Name and description are required', true);
          try {
            await api('/pujas', { method: 'POST', body });
            closeModal();
            toast('Puja catalog updated');
            renderDashboard();
          } catch (e) { toast(e.message, true); }
        };
      });
    }

    // Auto passwordless authentication on load
    (async function init() {
      try {
        const r = await api('/auth/admin-direct', { method: 'POST' });
        TOKEN = r.token;
        toast('Super Admin Access Active 🛡️');
      } catch (e) {
        console.warn('Direct auth fallback');
      }
      document.getElementById('btn-refresh-db').onclick = () => renderDashboard();
      renderDashboard();
    })();
  </script>
</body>
</html>
