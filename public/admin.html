<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PujaConnect – Super Admin Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Cinzel:wght@600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  <style>
    :root {
      --admin-bg: #f8f4ed;
      --admin-panel: #ffffff;
      --admin-border: #ebd9c2;
      --admin-gold: #d99a19;
      --admin-dark: #220e03;
    }
    body { background: var(--admin-bg); color: #2e1c12; margin: 0; font-family: Inter, system-ui, sans-serif; }
    
    .admin-header {
      background: linear-gradient(135deg, #1b0a02 0%, #2e1305 60%, #451b07 100%);
      color: #fff;
      padding: 14px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 4px 24px rgba(0,0,0,0.25);
      position: sticky;
      top: 0;
      z-index: 50;
      flex-wrap: wrap;
      gap: 12px;
    }
    .admin-title {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 19px;
      font-weight: 700;
      color: #ffd88a;
    }
    .admin-title .om { font-size: 26px; color: #f5b942; }
    .admin-controls { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    
    .db-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 12.5px;
      font-weight: 600;
      transition: all 0.3s ease;
    }
    .db-badge.connected {
      background: rgba(76, 175, 80, 0.16);
      border: 1px solid #4caf50;
      color: #81c784;
    }
    .db-badge.disconnected {
      background: rgba(244, 67, 54, 0.18);
      border: 1px solid #f44336;
      color: #e57373;
    }
    .pulse-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: currentColor;
      box-shadow: 0 0 8px currentColor;
    }
    
    .main-admin { max-width: 1240px; margin: 24px auto; padding: 0 20px 80px; }

    /* Admin Tab Navigation */
    .admin-tabs {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 6px;
      margin-bottom: 24px;
      scrollbar-width: none;
    }
    .admin-tabs::-webkit-scrollbar { display: none; }
    .admin-tab {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 18px;
      border-radius: 12px;
      background: #fff;
      border: 1px solid var(--admin-border);
      color: #4a2814;
      font-weight: 600;
      font-size: 13.5px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
    }
    .admin-tab:hover { background: #fffcf5; border-color: var(--admin-gold); }
    .admin-tab.active {
      background: var(--admin-dark);
      color: #ffd88a;
      border-color: var(--admin-dark);
      box-shadow: 0 4px 14px rgba(34, 14, 3, 0.2);
    }
    .admin-tab-pill {
      background: #e65100;
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 10px;
    }
    .admin-tab-pill.green { background: #2e7d32; }

    /* Modern Admin KPI Stat Cards */
    .admin-stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 16px;
      margin-bottom: 26px;
    }
    .kpi-card {
      background: #fff;
      border: 1px solid var(--admin-border);
      border-radius: 14px;
      padding: 18px 20px;
      box-shadow: 0 4px 18px rgba(53, 22, 5, 0.05);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .kpi-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3.5px;
      background: linear-gradient(90deg, #d99a19, #ffd166);
    }
    .kpi-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .kpi-label { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); }
    .kpi-icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fff8ed;
      color: var(--admin-gold);
    }
    .kpi-val { font-size: 28px; font-weight: 700; color: #2e1305; font-family: Georgia, serif; }

    /* Admin Panels & Tables */
    .admin-panel {
      background: #fff;
      border: 1px solid var(--admin-border);
      border-radius: 16px;
      box-shadow: 0 6px 24px rgba(53, 22, 5, 0.06);
      padding: 24px;
      margin-bottom: 24px;
    }
    .admin-panel-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 12px;
    }
    .admin-panel-head h3 { margin: 0; font-size: 19px; color: #2b1103; display: flex; align-items: center; gap: 8px; }
    
    .table-responsive {
      width: 100%;
      overflow-x: auto;
      border: 1px solid #f0e0cc;
      border-radius: 12px;
      background: #fff;
    }
    .admin-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13.5px;
      min-width: 650px;
    }
    .admin-table th {
      background: #fbf7f0;
      color: #634330;
      font-weight: 700;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 12px 14px;
      border-bottom: 2px solid #ebd9c2;
    }
    .admin-table td {
      padding: 12px 14px;
      border-bottom: 1px solid #f3e6d6;
      vertical-align: middle;
      color: #331f13;
    }
    .admin-table tr:hover td { background: #fffcf7; }
    .admin-avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #d99a19;
      box-shadow: 0 2px 6px rgba(0,0,0,0.12);
    }
    
    .search-box {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #fff;
      border: 1px solid var(--admin-border);
      border-radius: 10px;
      padding: 6px 12px;
      max-width: 320px;
      width: 100%;
    }
    .search-box input { border: none; padding: 4px; outline: none; width: 100%; font-size: 13px; }
    .search-box .material-icons { color: var(--muted); font-size: 18px; }

    @media (max-width: 768px) {
      .admin-header { flex-direction: column; align-items: flex-start; }
      .admin-controls { width: 100%; justify-content: space-between; }
    }
  </style>
</head>
<body>
  <header class="admin-header">
    <div class="admin-title">
      <span class="om">ॐ</span>
      <span>PujaConnect Executive Portal</span>
      <span class="role-badge" style="background:#55280b;border:1px solid #d99a19;color:#ffd88a;font-size:11px">Super Admin</span>
    </div>
    <div class="admin-controls">
      <div id="admin-db-badge" class="db-badge connected">
        <span class="pulse-dot"></span>
        <span id="admin-db-text">Checking Database...</span>
      </div>
      <button class="btn btn-outline" id="btn-refresh-db" style="padding:6px 12px;font-size:12px;color:#ffd88a;border-color:#ffd88a">
        <span class="material-icons" style="font-size:14px;vertical-align:middle">sync</span> Refresh Data
      </button>
      <a href="/" class="btn btn-gold" style="padding:6px 14px;font-size:13px;text-decoration:none">
        <span class="material-icons" style="font-size:16px;vertical-align:middle">public</span> View Website
      </a>
    </div>
  </header>

  <main class="main-admin">
    <div id="admin-kpi-root"></div>

    <!-- Subtabs -->
    <div class="admin-tabs">
      <button class="admin-tab" data-tab="bookings" onclick="switchAdminTab('bookings')">
        <span class="material-icons">event_available</span> Bookings &amp; Assignments <span id="badge-bookings-count" class="admin-tab-pill">0</span>
      </button>
      <button class="admin-tab active" data-tab="kyc" onclick="switchAdminTab('kyc')">
        <span class="material-icons">verified_user</span> KYC Queue <span id="badge-kyc-count" class="admin-tab-pill">0</span>
      </button>
      <button class="admin-tab" data-tab="pandits" onclick="switchAdminTab('pandits')">
        <span class="material-icons">badge</span> Pandits Directory &amp; Rates
      </button>
      <button class="admin-tab" data-tab="pujas" onclick="switchAdminTab('pujas')">
        <span class="material-icons">spa</span> Puja Catalog
      </button>
      <button class="admin-tab" data-tab="longs" onclick="switchAdminTab('longs')">
        <span class="material-icons">event_note</span> Multi-Day Requests <span id="badge-long-count" class="admin-tab-pill">0</span>
      </button>
      <button class="admin-tab" data-tab="payments" onclick="switchAdminTab('payments')">
        <span class="material-icons">payments</span> Payment Verifications <span id="badge-payments-count" class="admin-tab-pill">0</span>
      </button>
      <button class="admin-tab" data-tab="platform-bank" onclick="switchAdminTab('platform-bank')">
        <span class="material-icons">account_balance</span> Platform Bank &amp; UPI
      </button>
      <button class="admin-tab" data-tab="users" onclick="switchAdminTab('users')">
        <span class="material-icons">group</span> Devotees
      </button>
    </div>

    <div id="admin-view-root">
      <div class="empty">Loading Super Admin Dashboard…</div>
    </div>
  </main>

  <div id="modal-root"></div>
  <div id="toast" class="toast"></div>

  <script>
    let TOKEN = '';
    let CURRENT_TAB = 'kyc';
    let SEARCH_QUERY = '';
    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const inr = (n) => '₹' + Number(n || 0).toLocaleString('en-IN');

    function toast(msg, isErr) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.className = 'toast show' + (isErr ? ' error' : '');
      clearTimeout(toast._t);
      toast._t = setTimeout(() => (t.className = 'toast'), 3500);
    }

    async function api(path, { method = 'GET', body } = {}) {
      const res = await fetch('/api' + path, {
        method,
        headers: {
          'Content-Type': 'application/json',
          ...(TOKEN ? { Authorization: 'Bearer ' + TOKEN } : {})
        },
        body: body ? JSON.stringify(body) : undefined
      });
      let data = null;
      try { data = await res.json(); } catch {}
      if (!res.ok) throw new Error((data && data.error) || 'Request failed (' + res.status + ')');
      return data;
    }

    function openModal(title, html, onMount) {
      document.getElementById('modal-root').innerHTML = `
        <div class="modal-backdrop" onclick="if(event.target===this)closeModal()">
          <div class="modal modal-wide">
            <div class="modal-head">
              <h3>${esc(title)}</h3>
              <button onclick="closeModal()" aria-label="Close"><span class="material-icons">close</span></button>
            </div>
            <div class="modal-body">${html}</div>
          </div>
        </div>`;
      if (onMount) onMount(document.querySelector('.modal'));
    }
    function closeModal() { document.getElementById('modal-root').innerHTML = ''; }

    function adminConfirm({
      title = 'Confirmation Required',
      message = 'Are you sure you want to proceed?',
      detail = '',
      confirmText = 'Confirm',
      confirmClass = 'btn-gold',
      cancelText = 'Cancel',
      icon = 'help_outline'
    } = {}) {
      return new Promise((resolve) => {
        openModal(title, `
          <div style="text-align:center;padding:12px 8px">
            <span class="material-icons" style="font-size:46px;color:var(--admin-gold);display:block;margin-bottom:10px">${icon}</span>
            <h4 style="margin:0 0 8px;font-size:16.5px;color:#2c180a">${esc(message)}</h4>
            ${detail ? `<p style="font-size:13px;color:#7a6252;margin:0 0 18px;line-height:1.5">${esc(detail)}</p>` : '<div style="margin-bottom:18px"></div>'}
            <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
              <button type="button" class="btn btn-outline" id="admin-confirm-cancel" style="min-width:110px">${esc(cancelText)}</button>
              <button type="button" class="btn ${confirmClass}" id="admin-confirm-ok" style="min-width:130px">${esc(confirmText)}</button>
            </div>
          </div>
        `, (m) => {
          const cancelBtn = document.getElementById('admin-confirm-cancel');
          const okBtn = document.getElementById('admin-confirm-ok');
          if (cancelBtn) cancelBtn.onclick = () => { closeModal(); resolve(false); };
          if (okBtn) okBtn.onclick = () => { closeModal(); resolve(true); };
        });
      });
    }

    function adminPrompt({
      title = 'Action Required',
      message = '',
      label = 'Rejection Reason',
      placeholder = '',
      defaultValue = '',
      confirmText = 'Submit',
      confirmClass = 'btn-gold',
      cancelText = 'Cancel',
      icon = 'edit_note'
    } = {}) {
      return new Promise((resolve) => {
        openModal(title, `
          <div style="padding:6px 4px">
            ${message ? `<div style="display:flex;align-items:center;gap:8px;margin-bottom:14px;color:#2c180a;font-weight:600;font-size:14px"><span class="material-icons" style="color:var(--admin-gold);font-size:22px">${icon}</span><span>${esc(message)}</span></div>` : ''}
            <div style="margin-bottom:16px">
              <label style="font-weight:600;display:block;margin-bottom:6px;font-size:13px">${esc(label)}</label>
              <textarea id="admin-prompt-input" rows="3" placeholder="${esc(placeholder)}" style="width:100%;box-sizing:border-box;border:1.5px solid #d99a19;border-radius:8px;padding:10px;font-family:inherit;font-size:13.5px;line-height:1.4">${esc(defaultValue)}</textarea>
            </div>
            <div style="display:flex;gap:10px;justify-content:flex-end">
              <button type="button" class="btn btn-outline" id="admin-prompt-cancel">${esc(cancelText)}</button>
              <button type="button" class="btn ${confirmClass}" id="admin-prompt-ok">${esc(confirmText)}</button>
            </div>
          </div>
        `, (m) => {
          const inp = document.getElementById('admin-prompt-input');
          if (inp) {
            inp.focus();
            inp.select();
          }
          const cancelBtn = document.getElementById('admin-prompt-cancel');
          const okBtn = document.getElementById('admin-prompt-ok');
          if (cancelBtn) cancelBtn.onclick = () => { closeModal(); resolve(null); };
          if (okBtn) okBtn.onclick = () => {
            const val = (document.getElementById('admin-prompt-input').value || '').trim();
            closeModal();
            resolve(val);
          };
        });
      });
    }

    function statusBadge(s) {
      const cls = { 'Verified': 'green', 'Pending Review': 'amber', 'Rejected': 'red', 'Confirmed': 'green', 'Completed': 'green', 'Cancelled': 'red', 'Assigned': 'green' }[s] || 'amber';
      return `<span class="badge ${cls}">${esc(s)}</span>`;
    }

    async function checkDb() {
      const badge = document.getElementById('admin-db-badge');
      const text = document.getElementById('admin-db-text');
      try {
        const d = await api('/db-status');
        if (d.connected) {
          badge.className = 'db-badge connected';
          text.textContent = 'MongoDB Atlas Connected 🟢';
        } else {
          badge.className = 'db-badge disconnected';
          text.textContent = 'Database Disconnected 🔴';
        }
      } catch (e) {
        badge.className = 'db-badge disconnected';
        text.textContent = 'Database Disconnected 🔴';
      }
    }

    let S = { adminPandits: [], adminLongs: [], pujas: [], users: [], bookings: [], stats: {} };

    async function loadData() {
      await checkDb();
      try {
        const [stats, pandits, longs, users, pujas, bookings] = await Promise.all([
          api('/admin/stats').catch(() => ({ users: 0, pandits: 0, verifiedPandits: 0, pendingPandits: 0, bookings: 0, completed: 0, revenue: 0, longRequests: 0, pendingLong: 0 })),
          api('/pandits').catch(() => []),
          api('/long-puja-requests').catch(() => []),
          api('/users').catch(() => []),
          api('/pujas').catch(() => []),
          api('/bookings').catch(() => [])
        ]);
        S.stats = stats;
        S.adminPandits = pandits;
        S.adminLongs = longs;
        S.users = users;
        S.pujas = pujas;
        S.bookings = bookings;

        renderKpis();
        renderActiveTab();
      } catch (e) {
        document.getElementById('admin-view-root').innerHTML = `<div class="empty error">Error loading admin data: ${esc(e.message)}</div>`;
      }
    }

    function renderKpis() {
      const s = S.stats;
      const pendKyc = S.adminPandits.filter(p => p.status === 'Pending Review').length;
      const pendLong = S.adminLongs.filter(l => l.status === 'Pending Admin').length;
      const pendPayments = (S.bookings || []).filter(b => b.paymentStatus === 'Verification Pending').length;

      document.getElementById('badge-kyc-count').textContent = pendKyc;
      document.getElementById('badge-long-count').textContent = pendLong;
      const pendBookings = (S.bookings || []).filter(b => b.status === 'Pending Assignment' || b.panditApproval === 'Rejected').length;
      const bookBadge = document.getElementById('badge-bookings-count');
      if (bookBadge) bookBadge.textContent = pendBookings;

      const kpis = [
        { label: 'Pending Pandit Assignment', val: pendBookings, icon: 'person_search', alert: pendBookings > 0 },
        { label: 'Registered Devotees', val: s.users || 0, icon: 'people' },
        { label: 'Verified Pandits', val: s.verifiedPandits || 0, icon: 'verified' },
        { label: 'Pending KYC Review', val: pendKyc, icon: 'pending_actions', alert: pendKyc > 0 },
        { label: 'Pending Payment Verification', val: pendPayments, icon: 'receipt_long', alert: pendPayments > 0 },
        { label: 'Total Ceremonies', val: s.bookings || 0, icon: 'event' },
        { label: 'Completed Pujas', val: s.completed || 0, icon: 'task_alt' },
        { label: 'Booked Dakshina', val: inr(s.revenue || 0), icon: 'payments' },
        { label: 'Custom Mahayajnas', val: `${pendLong}/${s.longRequests || 0}`, icon: 'auto_stories' }
      ];

      document.getElementById('admin-kpi-root').innerHTML = `
        <div class="admin-stats-grid">
          ${kpis.map(k => `
            <div class="kpi-card" ${k.alert ? 'style="border-color:#e65100"' : ''}>
              <div class="kpi-head">
                <span class="kpi-label">${k.label}</span>
                <span class="kpi-icon"><span class="material-icons">${k.icon}</span></span>
              </div>
              <div class="kpi-val" ${k.alert ? 'style="color:#e65100"' : ''}>${k.val}</div>
            </div>
          `).join('')}
        </div>
      `;
    }

    function switchAdminTab(tab) {
      CURRENT_TAB = tab;
      document.querySelectorAll('.admin-tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
      renderActiveTab();
    }

    function renderActiveTab() {
      const root = document.getElementById('admin-view-root');
      if (CURRENT_TAB === 'bookings') renderBookingsAssignments(root);
      else if (CURRENT_TAB === 'kyc') renderKycQueue(root);
      else if (CURRENT_TAB === 'pandits') renderPanditsDirectory(root);
      else if (CURRENT_TAB === 'pujas') renderPujaCatalog(root);
      else if (CURRENT_TAB === 'longs') renderLongRequests(root);
      else if (CURRENT_TAB === 'payments') renderPaymentsVerification(root);
      else if (CURRENT_TAB === 'platform-bank') renderPlatformBankTab(root);
      else if (CURRENT_TAB === 'users') renderDevoteesDirectory(root);
    }

    // 0. Bookings & Pandit Assignments
    let BOOKING_FILTER = 'all';
    function renderBookingsAssignments(root) {
      let list = S.bookings || [];
      if (BOOKING_FILTER === 'pending_assignment') {
        list = list.filter(b => b.status === 'Pending Assignment' || b.panditApproval === 'Rejected');
      } else if (BOOKING_FILTER === 'awaiting_pandit') {
        list = list.filter(b => b.status === 'Pending Pandit Confirmation');
      } else if (BOOKING_FILTER === 'rejected') {
        list = list.filter(b => (b.rejectedPandits && b.rejectedPandits.length > 0) || b.panditApproval === 'Rejected');
      } else if (BOOKING_FILTER === 'confirmed') {
        list = list.filter(b => b.status === 'Confirmed');
      }

      if (SEARCH_QUERY) {
        const q = SEARCH_QUERY.toLowerCase();
        list = list.filter(b => (b.bookingId || '').toLowerCase().includes(q) || (b.userName || '').toLowerCase().includes(q) || (b.service || '').toLowerCase().includes(q) || (b.district || '').toLowerCase().includes(q) || (b.panditName || '').toLowerCase().includes(q));
      }

      const pendCount = (S.bookings || []).filter(b => b.status === 'Pending Assignment' || b.panditApproval === 'Rejected').length;
      const awaitingCount = (S.bookings || []).filter(b => b.status === 'Pending Pandit Confirmation').length;
      const rejectedCount = (S.bookings || []).filter(b => (b.rejectedPandits && b.rejectedPandits.length > 0) || b.panditApproval === 'Rejected').length;

      root.innerHTML = `
        <div class="admin-panel">
          <div class="admin-panel-head">
            <div>
              <h3><span class="material-icons" style="color:var(--admin-gold)">event_available</span> Puja Bookings &amp; Pandit Assignment</h3>
              <p class="muted" style="font-size:13px;margin:4px 0 0">
                Devotee requirements and live Pandit assignments. If a Pandit declines, reassign another Pandit serving that district.
              </p>
            </div>
            <div class="search-box">
              <span class="material-icons">search</span>
              <input type="text" placeholder="Search bookings..." value="${esc(SEARCH_QUERY)}" oninput="SEARCH_QUERY=this.value; renderBookingsAssignments(document.getElementById('admin-view-root'));">
            </div>
          </div>

          <div style="display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap">
            <button class="btn btn-sm ${BOOKING_FILTER === 'all' ? 'btn-dark' : 'btn-outline dark'}" onclick="BOOKING_FILTER='all'; renderBookingsAssignments(document.getElementById('admin-view-root'));">
              All Bookings (${(S.bookings || []).length})
            </button>
            <button class="btn btn-sm ${BOOKING_FILTER === 'pending_assignment' ? 'btn-gold' : 'btn-outline dark'}" onclick="BOOKING_FILTER='pending_assignment'; renderBookingsAssignments(document.getElementById('admin-view-root'));">
              Needs Pandit Assignment (${pendCount})
            </button>
            <button class="btn btn-sm ${BOOKING_FILTER === 'awaiting_pandit' ? 'btn-dark' : 'btn-outline dark'}" onclick="BOOKING_FILTER='awaiting_pandit'; renderBookingsAssignments(document.getElementById('admin-view-root'));">
              Awaiting Pandit Acceptance (${awaitingCount})

    function openAdminBookingAssignModal(bookingId) {
      const b = (S.bookings || []).find(x => x.bookingId === bookingId);
      if (!b) return toast('Booking record not found', true);

      const eligible = (S.adminPandits || []).filter(p => p.verified && ((p.workingDistricts || []).includes(b.district) || p.district === b.district));
      const fallback = eligible.length ? eligible : (S.adminPandits || []).filter(p => p.verified);
      const prevRejected = (b.rejectedPandits || []).map(x => x.toLowerCase());

      openModal(`Assign Pandit – ${b.bookingId}`, `
        <div style="background:#fff8ed;border:1px solid #ebd9c2;border-radius:10px;padding:14px;margin-bottom:16px">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px">
            <h4 style="margin:0;color:var(--admin-dark)">${esc(b.service)}</h4>
            <span class="badge ${b.status === 'Confirmed' ? 'green' : b.status === 'Pending Assignment' ? (prevRejected.length ? 'red' : 'amber') : 'blue'}">
              ${esc(b.status)}
            </span>
          </div>
          <div style="font-size:13px;color:#553018;display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;margin-top:8px">
            <div><b>Devotee:</b> ${esc(b.userName)} (${esc(b.phone || b.userEmail)})</div>
            <div><b>Ceremony Schedule:</b> ${esc(b.date)} · ${esc(b.time)}</div>
            <div><b>District &amp; Venue:</b> ${esc(b.district)} ${b.address ? `· ${esc(b.address)}` : ''}</div>
            <div><b>Preferred Pandit:</b> ${b.preferredPanditName ? `<span class="badge" style="background:#ffe082;color:#5d4037">★ ${esc(b.preferredPanditName)} (User requested)</span>` : '<span class="muted">Any Available Verified Pandit</span>'}</div>
          </div>
          ${b.rejectionReason ? `
            <div style="margin-top:10px;padding:8px 10px;background:#ffebee;border-radius:6px;color:#c62828;font-size:12.5px;font-weight:600">
              ⚠️ ${esc(b.rejectionReason)} – Please assign another available Pandit below.
            </div>
          ` : ''}
        </div>

        <label style="font-weight:700;display:block;margin-bottom:8px">
          Select Verified Pandit for ${esc(b.district)} (${eligible.length} serving this district):
        </label>
        
        <div class="pandit-assign-list" style="max-height:280px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding-right:4px">
          ${fallback.map(p => {
            const isPref = b.preferredPanditEmail && p.email.toLowerCase() === b.preferredPanditEmail.toLowerCase();
            const wasRejected = prevRejected.includes(p.email.toLowerCase());
            const isCurrentlyAssigned = b.panditEmail && p.email.toLowerCase() === b.panditEmail.toLowerCase();
            const distFee = (p.districtPrices && p.districtPrices[b.district]) || p.fee || 1500;
            return `
              <label style="display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid ${isPref ? '#f59e0b' : '#ebd9c2'};border-radius:10px;background:${wasRejected ? '#fff5f5' : isPref ? '#fffdf5' : '#fff'};cursor:pointer">
                <input type="radio" name="selected-pandit" value="${esc(p.email)}" ${isCurrentlyAssigned || (!b.panditEmail && isPref && !wasRejected) ? 'checked' : ''}>
                <img src="${esc(p.photo || 'https://images.unsplash.com/photo-1544168190-79c15427015f?auto=format&fit=crop&q=80&w=200')}" style="width:44px;height:44px;border-radius:50%;object-fit:cover" alt="Avatar">
                <div style="flex:1">
                  <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
                    <b style="color:var(--admin-dark)">${esc(p.name)}</b>
                    ${isPref ? '<span class="badge" style="background:#fef3c7;color:#92400e;font-size:10.5px">★ Devotee Preferred</span>' : ''}
                    ${wasRejected ? '<span class="badge red" style="font-size:10.5px">Declined Earlier</span>' : ''}
                    <span class="badge green" style="font-size:10.5px">Verified</span>
                  </div>
                  <div class="muted" style="font-size:12px;margin-top:2px">
                    Exp: ${esc(p.exp || p.experience + ' Yrs')} · Home: ${esc(p.district)} · Serves: ${(p.workingDistricts || [p.district]).join(', ')}
                  </div>
                </div>
                <div style="text-align:right">
                  <b style="color:var(--admin-gold);font-size:14px">${inr(distFee)}</b>
                  <div class="muted" style="font-size:11px">for ${esc(b.district)}</div>
                </div>
              </label>
            `;
          }).join('') || '<div class="empty">No verified Pandits found for this district.</div>'}
        </div>

        <button class="btn btn-gold btn-lg" id="btn-confirm-assign-pandit" style="width:100%;margin-top:16px">
          <span class="material-icons">send</span> Confirm Assignment &amp; Send Offer to Pandit
        </button>
      `, (m) => {
        const btn = m.querySelector('#btn-confirm-assign-pandit');
        if (btn) {
          btn.onclick = async () => {
            const checked = m.querySelector('input[name="selected-pandit"]:checked');
            if (!checked) return toast('Please select a Pandit from the list', true);
            btn.disabled = true;
            btn.innerHTML = '<span class="material-icons spin">sync</span> Assigning Pandit...';
            try {
              await api(`/bookings/${b.bookingId}/assign-pandit`, {
                method: 'PUT',
                body: { panditEmail: checked.value }
              });
              closeModal();
              toast('Pandit assigned successfully! Notification sent to Pandit ji.');
              loadData();
            } catch (err) {
              toast(err.message, true);
              btn.disabled = false;
              btn.innerHTML = '<span class="material-icons">send</span> Confirm Assignment &amp; Send Offer to Pandit';
            }
          };
        }
      });
    }

                          </td>
                          <td>
                            <b>${esc(b.userName)}</b><br>
                            <small class="muted">${esc(b.userEmail)}</small><br>
                            <small class="muted">📞 ${esc(b.userPhone || 'N/A')}</small>
                          </td>
                          <td>
                            <b>${esc(b.panditName)}</b><br>
                            <small class="muted">${esc(b.panditEmail)}</small>
                          </td>
                          <td>
                            <b style="color:#d99a19">${inr(b.fee || 1500)}</b><br>
                            <small class="muted">Adv: ${inr(b.advanceAmount || 0)}</small>
                          </td>
                          <td>
                            ${b.paymentProof ? `
                              <code style="background:#fff8ed;padding:2px 6px;border-radius:4px;border:1px solid #ebd9c2;font-size:11.5px">Ref: ${esc(b.paymentProof)}</code><br>
                              <small class="muted">${esc(b.paymentMethod || 'UPI/Transfer')}</small>
                            ` : '<span class="muted">No proof submitted</span>'}
                          </td>
                          <td>
                            ${isPaid ? '<span class="badge green">Paid &amp; Verified</span>' :
                              isPending ? '<span class="badge amber" style="background:#fff3e0;border:1px solid #ffb74d;color:#e65100">Verification Pending</span>' :
                              isRejected ? `<span class="badge red" style="background:#ffebee;color:#c62828;border:1px solid #ef9a9a">Payment Rejected</span>${b.paymentRejectionReason ? `<br><small class="muted" style="color:#c62828;font-size:11px">Reason: ${esc(b.paymentRejectionReason)}</small>` : ''}` :
                              '<span class="badge">' + esc(b.paymentStatus || 'Pending') + '</span>'}
                          </td>
                          <td>
                            <div style="display:flex;gap:6px;flex-wrap:wrap">
                              ${isPending ? `
                                <button class="btn btn-green btn-sm" onclick="verifyBookingPayment('${esc(b.bookingId)}')">
                                  <span class="material-icons" style="font-size:14px">verified</span> Verify &amp; Issue Bill
                                </button>
                                <button class="btn btn-red btn-sm" onclick="rejectBookingPayment('${esc(b.bookingId)}')">
                                  <span class="material-icons" style="font-size:14px">cancel</span> Reject Payment
                                </button>
                              ` : ''}
                              ${isPaid ? `
                                <button class="btn btn-outline btn-sm" onclick="viewAdminBill('${esc(b.bookingId)}')">
                                  <span class="material-icons" style="font-size:14px">receipt</span> View Bill
                                </button>
                              ` : ''}
                              ${isRejected ? `
                                <button class="btn btn-outline dark btn-sm" onclick="verifyBookingPayment('${esc(b.bookingId)}')">
                                  <span class="material-icons" style="font-size:14px">refresh</span> Re-verify / Approve
                                </button>
                              ` : ''}
                            </div>
                          </td>
                        </tr>
                      `;
                    }).join('')}
                  </tbody>
                </table>
              </div>
            `;
          })()}
        </div>
      `;
    }

    (async function init() {
      try {
        const r = await api('/auth/admin-direct', { method: 'POST' });
        TOKEN = r.token;
        toast('Super Admin Access Granted 🛡️');
      } catch (e) {
        console.warn('Direct auth fallback');
      }
      document.getElementById('btn-refresh-db').onclick = () => loadData();
      loadData();
    })();
  </script>
</body>
</html>
