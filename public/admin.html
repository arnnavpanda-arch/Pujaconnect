<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PujaConnect – Super Admin Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Cinzel:wght@600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  <style>
    :root {
      --admin-bg: #f8f4ed;
      --admin-panel: #ffffff;
      --admin-border: #ebd9c2;
      --admin-gold: #d99a19;
      --admin-dark: #220e03;
    }
    body { background: var(--admin-bg); color: #2e1c12; margin: 0; font-family: Inter, system-ui, sans-serif; }
    
    .admin-header {
      background: linear-gradient(135deg, #1b0a02 0%, #2e1305 60%, #451b07 100%);
      color: #fff;
      padding: 14px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 4px 24px rgba(0,0,0,0.25);
      position: sticky;
      top: 0;
      z-index: 50;
      flex-wrap: wrap;
      gap: 12px;
    }
    .admin-title {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 19px;
      font-weight: 700;
      color: #ffd88a;
    }
    .admin-title .om { font-size: 26px; color: #f5b942; }
    .admin-controls { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    
    .db-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 12.5px;
      font-weight: 600;
      transition: all 0.3s ease;
    }
    .db-badge.connected {
      background: rgba(76, 175, 80, 0.16);
      border: 1px solid #4caf50;
      color: #81c784;
    }
    .db-badge.disconnected {
      background: rgba(244, 67, 54, 0.18);
      border: 1px solid #f44336;
      color: #e57373;
    }
    .pulse-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: currentColor;
      box-shadow: 0 0 8px currentColor;
    }
    
    .main-admin { max-width: 1240px; margin: 24px auto; padding: 0 20px 80px; }

    /* Admin Tab Navigation */
    .admin-tabs {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 6px;
      margin-bottom: 24px;
      scrollbar-width: none;
    }
    .admin-tabs::-webkit-scrollbar { display: none; }
    .admin-tab {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 18px;
      border-radius: 12px;
      background: #fff;
      border: 1px solid var(--admin-border);
      color: #4a2814;
      font-weight: 600;
      font-size: 13.5px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
    }
    .admin-tab:hover { background: #fffcf5; border-color: var(--admin-gold); }
    .admin-tab.active {
      background: var(--admin-dark);
      color: #ffd88a;
      border-color: var(--admin-dark);
      box-shadow: 0 4px 14px rgba(34, 14, 3, 0.2);
    }
    .admin-tab-pill {
      background: #e65100;
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 10px;
    }
    .admin-tab-pill.green { background: #2e7d32; }

    /* Modern Admin KPI Stat Cards */
    .admin-stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 16px;
      margin-bottom: 26px;
    }
    .kpi-card {
      background: #fff;
      border: 1px solid var(--admin-border);
      border-radius: 14px;
      padding: 18px 20px;
      box-shadow: 0 4px 18px rgba(53, 22, 5, 0.05);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .kpi-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3.5px;
      background: linear-gradient(90deg, #d99a19, #ffd166);
    }
    .kpi-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .kpi-label { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); }
    .kpi-icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fff8ed;
      color: var(--admin-gold);
    }
    .kpi-val { font-size: 28px; font-weight: 700; color: #2e1305; font-family: Georgia, serif; }

    /* Admin Panels & Tables */
    .admin-panel {
      background: #fff;
      border: 1px solid var(--admin-border);
      border-radius: 16px;
      box-shadow: 0 6px 24px rgba(53, 22, 5, 0.06);
      padding: 24px;
      margin-bottom: 24px;
    }
    .admin-panel-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 12px;
    }
    .admin-panel-head h3 { margin: 0; font-size: 19px; color: #2b1103; display: flex; align-items: center; gap: 8px; }
    
    .table-responsive {
      width: 100%;
      overflow-x: auto;
      border: 1px solid #f0e0cc;
      border-radius: 12px;
      background: #fff;
    }
    .admin-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13.5px;
      min-width: 650px;
    }
    .admin-table th {
      background: #fbf7f0;
      color: #634330;
      font-weight: 700;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 12px 14px;
      border-bottom: 2px solid #ebd9c2;
    }
    .admin-table td {
      padding: 12px 14px;
      border-bottom: 1px solid #f3e6d6;
      vertical-align: middle;
      color: #331f13;
    }
    .admin-table tr:hover td { background: #fffcf7; }
    .admin-avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #d99a19;
      box-shadow: 0 2px 6px rgba(0,0,0,0.12);
    }
    
    .search-box {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #fff;
      border: 1px solid var(--admin-border);
      border-radius: 10px;
      padding: 6px 12px;
      max-width: 320px;
      width: 100%;
    }
    .search-box input { border: none; padding: 4px; outline: none; width: 100%; font-size: 13px; }
    .search-box .material-icons { color: var(--muted); font-size: 18px; }

    .th-cb, .td-cb {
      width: 42px !important;
      text-align: center !important;
      padding-left: 8px !important;
      padding-right: 8px !important;
    }
    .admin-table input[type="checkbox"] {
      width: 17px;
      height: 17px;
      cursor: pointer;
      accent-color: var(--admin-gold);
      vertical-align: middle;
    }
    .bulk-bar {
      background: #fff8ed;
      border: 1.5px solid #d99a19;
      border-radius: 10px;
      padding: 10px 16px;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    @media print {
      body { background: #fff !important; color: #000 !important; font-size: 10pt !important; margin: 0 !important; padding: 0 !important; }
      .admin-header, .admin-tabs, #admin-kpi-root, .admin-controls, .search-box, .btn, .no-print, .bulk-bar, .modal-backdrop, .toast {
        display: none !important;
      }
      .main-admin, .admin-panel {
        max-width: 100% !important;
        margin: 0 !important;
        padding: 0 !important;
        border: none !important;
        box-shadow: none !important;
        background: transparent !important;
      }
      .table-responsive {
        overflow: visible !important;
        border: none !important;
      }
      .admin-table {
        width: 100% !important;
        min-width: 100% !important;
        border-collapse: collapse !important;
      }
      .admin-table th, .admin-table td {
        border: 1px solid #777 !important;
        padding: 6px 8px !important;
        color: #000 !important;
        background: #fff !important;
        font-size: 10.5px !important;
        word-break: break-word !important;
      }
      .admin-table th { background: #eee !important; }
      .th-cb, .td-cb, .admin-table th:last-child, .admin-table td:last-child {
        display: none !important;
      }
    }
  </style>
</head>
<body>
  <header class="admin-header">
    <div class="admin-title">
      <span class="om">ॐ</span>
      <span>PujaConnect Executive Portal</span>
      <span class="role-badge" style="background:#55280b;border:1px solid #d99a19;color:#ffd88a;font-size:11px">Super Admin</span>
    </div>
    <div class="admin-controls">
      <div id="admin-db-badge" class="db-badge connected">
        <span class="pulse-dot"></span>
        <span id="admin-db-text">Checking Database...</span>
      </div>
      <button class="btn btn-outline" id="btn-refresh-db" style="padding:6px 12px;font-size:12px;color:#ffd88a;border-color:#ffd88a">
        <span class="material-icons" style="font-size:14px;vertical-align:middle">sync</span> Refresh Data
      </button>
      <a href="/#puja-prices" target="_blank" class="btn btn-outline" style="padding:6px 14px;font-size:13px;color:#ffd88a;border-color:#ffd88a;text-decoration:none">
        <span class="material-icons" style="font-size:16px;vertical-align:middle">receipt_long</span> A4 Price Chart
      </a>
      <a href="/" class="btn btn-gold" style="padding:6px 14px;font-size:13px;text-decoration:none">
        <span class="material-icons" style="font-size:16px;vertical-align:middle">public</span> View Website
      </a>
    </div>
  </header>

  <main class="main-admin">
    <div id="admin-kpi-root"></div>

    <!-- Subtabs -->
    <div class="admin-tabs">
      <button class="admin-tab active" data-tab="bookings" onclick="switchAdminTab('bookings')">
        <span class="material-icons">event_available</span> Bookings &amp; Assignments <span id="badge-bookings-count" class="admin-tab-pill">0</span>
      </button>
      <button class="admin-tab" data-tab="kyc" onclick="switchAdminTab('kyc')">
        <span class="material-icons">verified_user</span> KYC Queue <span id="badge-kyc-count" class="admin-tab-pill">0</span>
      </button>
      <button class="admin-tab" data-tab="pandits" onclick="switchAdminTab('pandits')">
        <span class="material-icons">badge</span> Pandits Directory &amp; Rates
      </button>
      <button class="admin-tab" data-tab="pujas" onclick="switchAdminTab('pujas')">
        <span class="material-icons">spa</span> Puja Catalog
      </button>
      <button class="admin-tab" data-tab="longs" onclick="switchAdminTab('longs')">
        <span class="material-icons">event_note</span> Multi-Day Requests <span id="badge-long-count" class="admin-tab-pill">0</span>
      </button>
      <button class="admin-tab" data-tab="payments" onclick="switchAdminTab('payments')">
        <span class="material-icons">payments</span> Payment Verifications <span id="badge-payments-count" class="admin-tab-pill">0</span>
      </button>
      <button class="admin-tab" data-tab="pandit-payouts" onclick="switchAdminTab('pandit-payouts')">
        <span class="material-icons">account_balance_wallet</span> Pandit Payment <span id="badge-pandit-payouts-count" class="admin-tab-pill">0</span>
      </button>
      <button class="admin-tab" data-tab="platform-bank" onclick="switchAdminTab('platform-bank')">
        <span class="material-icons">account_balance</span> Platform Bank &amp; UPI
      </button>
      <button class="admin-tab" data-tab="users" onclick="switchAdminTab('users')">
        <span class="material-icons">group</span> Devotees
      </button>
    </div>

    <div id="admin-view-root">
      <div class="empty">Loading Super Admin Dashboard…</div>
    </div>
  </main>

  <div id="modal-root"></div>
  <div id="toast" class="toast"></div>

  <script>
    let TOKEN = localStorage.getItem('pc_admin_token') || localStorage.getItem('admin_token') || localStorage.getItem('pc_token') || '';
    let CURRENT_TAB = 'bookings';
    let SEARCH_QUERY = '';
    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const inr = (n) => '₹' + Number(n || 0).toLocaleString('en-IN');

    const SELECTED = {
      bookings: new Set(),
      pandits: new Set(),
      payments: new Set(),
      users: new Set()
    };

    function toggleSelectRow(type, id, checked) {
      if (!SELECTED[type]) SELECTED[type] = new Set();
      if (checked) {
        SELECTED[type].add(id);
      } else {
        SELECTED[type].delete(id);
      }
      renderActiveTab();
    }

    function toggleSelectAll(type, checked, allIds) {
      if (!SELECTED[type]) SELECTED[type] = new Set();
      if (checked) {
        allIds.forEach(id => SELECTED[type].add(id));
      } else {
        allIds.forEach(id => SELECTED[type].delete(id));
      }
      renderActiveTab();
    }

    function clearSelection(type) {
      if (SELECTED[type]) SELECTED[type].clear();
      renderActiveTab();
    }

    function getBulkBarHtml(type, singularLabel, deleteFnName) {
      const count = (SELECTED[type] && SELECTED[type].size) || 0;
      if (!count) return '';
      return `
        <div class="bulk-bar">
          <div style="display:flex;align-items:center;gap:8px">
            <span class="material-icons" style="color:var(--admin-gold);font-size:20px">check_box</span>
            <b style="color:var(--admin-dark);font-size:13.5px">${count} ${singularLabel}${count > 1 ? 's' : ''} selected</b>
          </div>
          <div style="display:flex;gap:8px;align-items:center">
            <button class="btn btn-red btn-sm" onclick="${deleteFnName}()">
              <span class="material-icons" style="font-size:14px;vertical-align:middle">delete</span> Delete Selected (${count})
            </button>
            <button class="btn btn-outline dark btn-sm" onclick="clearSelection('${type}')">
              Deselect All
            </button>
          </div>
        </div>
      `;
    }

    function toast(msg, isErr) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.className = 'toast show' + (isErr ? ' error' : '');
      clearTimeout(toast._t);
      toast._t = setTimeout(() => (t.className = 'toast'), 3500);
    }

    async function api(path, { method = 'GET', body } = {}) {
      const res = await fetch('/api' + path, {
        method,
        headers: {
          'Content-Type': 'application/json',
          ...(TOKEN ? { Authorization: 'Bearer ' + TOKEN } : {})
        },
        body: body ? JSON.stringify(body) : undefined
      });
      let data = null;
      try { data = await res.json(); } catch {}
      if (!res.ok) throw new Error((data && data.error) || 'Request failed (' + res.status + ')');
      return data;
    }

    function openModal(title, html, onMount) {
      document.getElementById('modal-root').innerHTML = `
        <div class="modal-backdrop" onclick="if(event.target===this)closeModal()">
          <div class="modal modal-wide">
            <div class="modal-head">
              <h3>${esc(title)}</h3>
              <button onclick="closeModal()" aria-label="Close"><span class="material-icons">close</span></button>
            </div>
            <div class="modal-body">${html}</div>
          </div>
        </div>`;
      if (onMount) onMount(document.querySelector('.modal'));
    }
    function closeModal() { document.getElementById('modal-root').innerHTML = ''; }

    function adminConfirm({
      title = 'Confirmation Required',
      message = 'Are you sure you want to proceed?',
      detail = '',
      confirmText = 'Confirm',
      confirmClass = 'btn-gold',
      cancelText = 'Cancel',
      icon = 'help_outline'
    } = {}) {
      return new Promise((resolve) => {
        openModal(title, `
          <div style="text-align:center;padding:12px 8px">
            <span class="material-icons" style="font-size:46px;color:var(--admin-gold);display:block;margin-bottom:10px">${icon}</span>
            <h4 style="margin:0 0 8px;font-size:16.5px;color:#2c180a">${esc(message)}</h4>
            ${detail ? `<p style="font-size:13px;color:#7a6252;margin:0 0 18px;line-height:1.5">${esc(detail)}</p>` : '<div style="margin-bottom:18px"></div>'}
            <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
              <button type="button" class="btn btn-outline" id="admin-confirm-cancel" style="min-width:110px">${esc(cancelText)}</button>
              <button type="button" class="btn ${confirmClass}" id="admin-confirm-ok" style="min-width:130px">${esc(confirmText)}</button>
            </div>
          </div>
        `, (m) => {
          const cancelBtn = document.getElementById('admin-confirm-cancel');
          const okBtn = document.getElementById('admin-confirm-ok');
          if (cancelBtn) cancelBtn.onclick = () => { closeModal(); resolve(false); };
          if (okBtn) okBtn.onclick = () => { closeModal(); resolve(true); };
        });
      });
    }

    function adminPrompt({
      title = 'Action Required',
      message = '',
      label = 'Rejection Reason',
      placeholder = '',
      defaultValue = '',
      confirmText = 'Submit',
      confirmClass = 'btn-gold',
      cancelText = 'Cancel',
      icon = 'edit_note'
    } = {}) {
      return new Promise((resolve) => {
        openModal(title, `
          <div style="padding:6px 4px">
            ${message ? `<div style="display:flex;align-items:center;gap:8px;margin-bottom:14px;color:#2c180a;font-weight:600;font-size:14px"><span class="material-icons" style="color:var(--admin-gold);font-size:22px">${icon}</span><span>${esc(message)}</span></div>` : ''}
            <div style="margin-bottom:16px">
              <label style="font-weight:600;display:block;margin-bottom:6px;font-size:13px">${esc(label)}</label>
              <textarea id="admin-prompt-input" rows="3" placeholder="${esc(placeholder)}" style="width:100%;box-sizing:border-box;border:1.5px solid #d99a19;border-radius:8px;padding:10px;font-family:inherit;font-size:13.5px;line-height:1.4">${esc(defaultValue)}</textarea>
            </div>
            <div style="display:flex;gap:10px;justify-content:flex-end">
              <button type="button" class="btn btn-outline" id="admin-prompt-cancel">${esc(cancelText)}</button>
              <button type="button" class="btn ${confirmClass}" id="admin-prompt-ok">${esc(confirmText)}</button>
            </div>
          </div>
        `, (m) => {
          const inp = document.getElementById('admin-prompt-input');
          if (inp) {
            inp.focus();
            inp.select();
          }
          const cancelBtn = document.getElementById('admin-prompt-cancel');
          const okBtn = document.getElementById('admin-prompt-ok');
          if (cancelBtn) cancelBtn.onclick = () => { closeModal(); resolve(null); };
          if (okBtn) okBtn.onclick = () => {
            const val = (document.getElementById('admin-prompt-input').value || '').trim();
            closeModal();
            resolve(val);
          };
        });
      });
    }

    function statusBadge(s) {
      const cls = { 'Verified': 'green', 'Pending Review': 'amber', 'Rejected': 'red', 'Confirmed': 'green', 'Completed': 'green', 'Cancelled': 'red', 'Assigned': 'green' }[s] || 'amber';
      return `<span class="badge ${cls}">${esc(s)}</span>`;
    }

    async function checkDb() {
      const badge = document.getElementById('admin-db-badge');
      const text = document.getElementById('admin-db-text');
      try {
        const d = await api('/db-status');
        if (d.connected) {
          badge.className = 'db-badge connected';
          text.textContent = 'MongoDB Atlas Connected 🟢';
        } else {
          badge.className = 'db-badge disconnected';
          text.textContent = 'Database Disconnected 🔴';
        }
      } catch (e) {
        badge.className = 'db-badge disconnected';
        text.textContent = 'Database Disconnected 🔴';
      }
    }

    let S = { adminPandits: [], adminLongs: [], pujas: [], users: [], bookings: [], stats: {}, commissionPercent: 10 };

    async function loadData() {
      // Run DB status check concurrently in parallel so it never delays data fetching
      checkDb().catch(() => {});
      try {
        const [stats, pandits, longs, users, pujas, bookings, commissionData] = await Promise.all([
          api('/admin/stats').catch(() => ({ users: 0, pandits: 0, verifiedPandits: 0, pendingPandits: 0, bookings: 0, completed: 0, revenue: 0, longRequests: 0, pendingLong: 0 })),
          api('/pandits').catch(() => []),
          api('/long-puja-requests').catch(() => []),
          api('/users').catch(() => []),
          api('/pujas').catch(() => []),
          api('/bookings').catch(() => []),
          api('/platform-commission').catch(() => ({ commissionPercent: 10 }))
        ]);
        S.stats = stats || {};
        S.adminPandits = Array.isArray(pandits) ? pandits : [];
        S.adminLongs = Array.isArray(longs) ? longs : [];
        S.users = Array.isArray(users) ? users : [];
        S.pujas = Array.isArray(pujas) ? pujas : [];
        S.bookings = Array.isArray(bookings) ? bookings : [];
        S.commissionPercent = (commissionData && (typeof commissionData.percent === 'number' ? commissionData.percent : commissionData.commissionPercent)) ?? 10;

        renderKpis();
        renderActiveTab();
      } catch (e) {
        console.error('loadData error:', e);
        document.getElementById('admin-view-root').innerHTML = `<div class="empty error">Error loading admin data: ${esc(e.message)}</div>`;
      }
    }

    function renderKpis() {
      const s = S.stats;
      const pendKyc = S.adminPandits.filter(p => p.status === 'Pending Review').length;
      const pendLong = S.adminLongs.filter(l => l.status === 'Pending Admin').length;
      const pendPayments = (S.bookings || []).filter(b => b.paymentStatus === 'Under Processing' || b.paymentStatus === 'Verification Pending').length;

      const eligiblePayoutBookings = (S.bookings || []).filter(b => b.panditEmail && (b.paymentStatus === 'Paid' || b.paymentStatus === 'Paid & Verified' || ['Completed', 'Confirmed', 'In Progress'].includes(b.status)));
      const pendPanditPayouts = eligiblePayoutBookings.filter(b => b.panditPayoutStatus !== 'Paid').length;

      const kycBadge = document.getElementById('badge-kyc-count');
      if (kycBadge) kycBadge.textContent = pendKyc;
      const longBadge = document.getElementById('badge-long-count');
      if (longBadge) longBadge.textContent = pendLong;
      const pendBookings = (S.bookings || []).filter(b => b.status === 'Pending Assignment' || b.panditApproval === 'Rejected').length;
      const bookBadge = document.getElementById('badge-bookings-count');
      if (bookBadge) bookBadge.textContent = pendBookings;
      const payoutBadge = document.getElementById('badge-pandit-payouts-count');
      if (payoutBadge) payoutBadge.textContent = pendPanditPayouts;

      else if (CURRENT_TAB === 'payments') renderPaymentsVerification(root);

        list = list.filter(b => b.status === 'Pending Pandit Confirmation');

        list = list.filter(b => b.status === 'Confirmed');
      }

      if (SEARCH_QUERY) {
        const q = SEARCH_QUERY.toLowerCase();
        list = list.filter(b => (b.bookingId || '').toLowerCase().includes(q) || (b.userName || '').toLowerCase().includes(q) || (b.service || '').toLowerCase().includes(q) || (b.district || '').toLowerCase().includes(q) || (b.panditName || '').toLowerCase().includes(q));

              Confirmed
            </button>
          </div>

          ${getBulkBarHtml('bookings', 'booking', 'deleteSelectedBookings')}

          ${list.length ? `
            <div class="table-responsive">
              <table class="admin-table">
                <thead>
                  <tr>
                    <th class="th-cb"><input type="checkbox" ${allBookingsSelected ? 'checked' : ''} onchange="toggleSelectAll('bookings', this.checked, [${visibleBookingIds.map(id => `'${esc(id)}'`).join(',')}])" title="Select All Bookings"></th>

                    <th>District &amp; Schedule</th>

      const b = (S.bookings || []).find(x => x.bookingId === bookingId);
      if (!b) return toast('Booking record not found', true);

      const eligible = (S.adminPandits || []).filter(p => p.verified && ((p.workingDistricts || []).includes(b.district) || p.district === b.district));
      const fallback = eligible.length ? eligible : (S.adminPandits || []).filter(p => p.verified);
      const prevRejected = (b.rejectedPandits || []).map(x => x.toLowerCase());

      openModal(`Assign Pandit – ${b.bookingId}`, `
        <div style="background:#fff8ed;border:1px solid #ebd9c2;border-radius:10px;padding:14px;margin-bottom:16px">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px">

              ${esc(b.status)}
            </span>
          </div>
          <div style="font-size:13px;color:#553018;display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;margin-top:8px">
            <div><b>Devotee:</b> ${esc(b.userName)} (${esc(b.phone || b.userEmail)})</div>
            <div><b>Ceremony Schedule:</b> ${esc(b.date)} · ${esc(b.time)}</div>
            <div><b>District &amp; Venue:</b> ${esc(b.district)} ${b.address ? `· ${esc(b.address)}` : ''}</div>
            <div><b>Preferred Pandit:</b> ${b.preferredPanditName ? `<span class="badge" style="background:#ffe082;color:#5d4037">★ ${esc(b.preferredPanditName)} (User requested)</span>` : '<span class="muted">Any Available Verified Pandit</span>'}</div>
          </div>
          ${b.rejectionReason ? `
            <div style="margin-top:10px;padding:8px 10px;background:#ffebee;border-radius:6px;color:#c62828;font-size:12.5px;font-weight:600">
              ⚠️ ${esc(b.rejectionReason)} – Please assign another available Pandit below.
            </div>
          ` : ''}
        </div>

        <label style="font-weight:700;display:block;margin-bottom:8px">
          Select Verified Pandit for ${esc(b.district)} (${eligible.length} serving this district):
        </label>
        
        <div class="pandit-assign-list" style="max-height:280px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding-right:4px">
          ${fallback.map(p => {
            const isPref = b.preferredPanditEmail && p.email.toLowerCase() === b.preferredPanditEmail.toLowerCase();
            const wasRejected = prevRejected.includes(p.email.toLowerCase());
            const isCurrentlyAssigned = b.panditEmail && p.email.toLowerCase() === b.panditEmail.toLowerCase();
            const distFee = (p.districtPrices && p.districtPrices[b.district]) || p.fee || 1500;
            return `
              <label style="display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid ${isPref ? '#f59e0b' : '#ebd9c2'};border-radius:10px;background:${wasRejected ? '#fff5f5' : isPref ? '#fffdf5' : '#fff'};cursor:pointer">
                <input type="radio" name="selected-pandit" value="${esc(p.email)}" ${isCurrentlyAssigned || (!b.panditEmail && isPref && !wasRejected) ? 'checked' : ''}>
                <img src="${esc(p.photo || 'https://images.unsplash.com/photo-1544168190-79c15427015f?auto=format&fit=crop&q=80&w=200')}" style="width:44px;height:44px;border-radius:50%;object-fit:cover" alt="Avatar">
                <div style="flex:1">
                  <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
                    <b style="color:var(--admin-dark)">${esc(p.name)}</b>
                    ${isPref ? '<span class="badge" style="background:#fef3c7;color:#92400e;font-size:10.5px">★ Devotee Preferred</span>' : ''}
                    ${wasRejected ? '<span class="badge red" style="font-size:10.5px">Declined Earlier</span>' : ''}
                    <span class="badge green" style="font-size:10.5px">Verified</span>
                  </div>
                  <div class="muted" style="font-size:12px;margin-top:2px">
                    Exp: ${esc(p.exp || p.experience + ' Yrs')} · Home: ${esc(p.district)} · Serves: ${(p.workingDistricts || [p.district]).join(', ')}
                  </div>
                </div>
                <div style="text-align:right">
                  <b style="color:var(--admin-gold);font-size:14px">${inr(distFee)}</b>
                  <div class="muted" style="font-size:11px">for ${esc(b.district)}</div>
                </div>
              </label>
            `;
          }).join('') || '<div class="empty">No verified Pandits found for this district.</div>'}
        </div>

        <button class="btn btn-gold btn-lg" id="btn-confirm-assign-pandit" style="width:100%;margin-top:16px">
          <span class="material-icons">send</span> Confirm Assignment &amp; Send Offer to Pandit
        </button>
      `, (m) => {
        const btn = m.querySelector('#btn-confirm-assign-pandit');
        if (btn) {
          btn.onclick = async () => {
            const checked = m.querySelector('input[name="selected-pandit"]:checked');
            if (!checked) return toast('Please select a Pandit from the list', true);
            btn.disabled = true;
            btn.innerHTML = '<span class="material-icons spin">sync</span> Assigning Pandit...';
            try {
              await api(`/bookings/${b.bookingId}/assign-pandit`, {
                method: 'PUT',
                body: { panditEmail: checked.value }
              });
              closeModal();
              toast('Pandit assigned successfully! Notification sent to Pandit ji.');
              loadData();
            } catch (err) {
              toast(err.message, true);
              btn.disabled = false;
              btn.innerHTML = '<span class="material-icons">send</span> Confirm Assignment &amp; Send Offer to Pandit';
            }
          };
        }
      });
    }

    async function rejectBookingSlotClash(id) {
      const b = (S.bookings || []).find(x => x.bookingId === id);
      const defaultReason = 'No verified Vedic Pandit is available for this date and time slot. Please reschedule or rebook with another date/time.';
      const reason = await adminPrompt({
        title: 'Reject Ceremony Slot (No Pandit Available for this time slot)',
        message: `Devotee ${b ? b.userName : ''} requested ${b ? b.service : 'Puja'} on ${b ? b.date + ' at ' + (b.time || '') : 'this slot'}.`,
        label: 'Rejection Reason (will be emailed to devotee with Rebook link):',
        placeholder: defaultReason,
        defaultValue: defaultReason,
        confirmText: 'Reject Slot & Send Rebook Mail',
        confirmClass: 'btn-red',
        icon: 'event_busy'
      });
      if (reason === null) return;

      try {
        await api('/bookings/' + encodeURIComponent(id) + '/reject-slot', {
          method: 'POST',
          body: { reason: reason.trim() || defaultReason }
        });
        toast('Booking marked as Rejected (No Pandit for Slot). Rebook email sent to Devotee! 🙏');
        closeModal();
        loadData();
      } catch (e) {
        toast(e.message, true);
      }
    }

    async function deleteBooking(bookingId) {
      const ok = await adminConfirm({
        title: 'Delete Ceremony Booking',
        message: `Delete Booking ${bookingId}?`,
        detail: 'This will permanently remove the ceremony booking, its assignment, and linked payment records from the system. This action cannot be undone.',
        confirmText: 'Delete Booking',
        confirmClass: 'btn-red',
        icon: 'delete_forever'
      });
      if (!ok) return;

      try {
        await api('/bookings/' + encodeURIComponent(bookingId), { method: 'DELETE' });
        S.bookings = (S.bookings || []).filter(b => b.bookingId !== bookingId && b._id !== bookingId);
        SELECTED.bookings.delete(bookingId);
        SELECTED.payments.delete(bookingId);
        toast(`Booking ${bookingId} deleted successfully`);
        renderKpis();
        renderActiveTab();
      } catch (e) {
        toast('Error deleting booking: ' + e.message, true);
      }
    }

    async function deleteSelectedBookings() {
      const ids = Array.from(SELECTED.bookings);
      if (!ids.length) return;
      const ok = await adminConfirm({
        title: 'Bulk Delete Bookings',
        message: `Permanently delete ${ids.length} selected booking(s)?`,
        detail: 'All selected ceremony bookings, schedules, and linked payment records will be permanently removed from the platform. This action cannot be undone.',
        confirmText: `Delete ${ids.length} Bookings`,
        confirmClass: 'btn-red',
        icon: 'delete_sweep'
      });
      if (!ok) return;

      try {
        const res = await api('/bookings/bulk-delete', { method: 'POST', body: { ids } });
        const idSet = new Set(ids);
        S.bookings = (S.bookings || []).filter(b => !idSet.has(b.bookingId) && !idSet.has(b._id));
        SELECTED.bookings.clear();
        ids.forEach(id => SELECTED.payments.delete(id));
        toast(`${res.count || ids.length} bookings deleted successfully`);
        renderKpis();
        renderActiveTab();
      } catch (e) {
        toast('Error in bulk delete: ' + e.message, true);
      }
    }

      });

      const allShortPujas = (S.pujas || []).filter(p => p.type === 'Short').map(p => p.name);
      const allVerifiedPandits = (S.adminPandits || []).filter(p => p.verified || p.status === 'Verified');

      const otherPandits = allVerifiedPandits.filter(p => !inDistPandits.includes(p));
      const eligiblePandits = [...inDistPandits, ...otherPandits];

      openModal(`Book / Rebook Ceremony for ${name}`, `
        <div style="background:#fff8ed;border:1px solid #ebd9c2;border-radius:10px;padding:14px;margin-bottom:16px">

            <div>
              <h4 style="margin:0;color:var(--admin-dark)">Devotee Rebook &amp; Ceremony Scheduling</h4>
              <span class="muted" style="font-size:12.5px">${esc(name)} · ${esc(email)} · 📞 ${esc(phone || 'N/A')} · ${esc(district || '')}${state ? ', ' + esc(state) : ''}</span>
            </div>
          </div>
        </div>

        <div class="form-grid" style="padding:0">
          <div>
            <label>Puja / Sacred Ritual *</label>
            <select id="rb-service">
              ${(allShortPujas.length ? allShortPujas : ['Satyanarayan Puja', 'Griha Pravesh', 'Ganesh Puja', 'Rudrabhishek']).map(p => `<option value="${esc(p)}">${esc(p)}</option>`).join('')}
            </select>
          </div>
          <div>
            <label>Ceremony District *</label>
            <input id="rb-district" value="${esc(district || 'Khordha')}" placeholder="District">
          </div>
          <div>
            <label>Ceremony Date *</label>
            <input type="date" id="rb-date" value="${new Date().toISOString().split('T')[0]}">
          </div>
          <div>
            <label>Ceremony Time Slot *</label>
            <select id="rb-time">
              <option value="08:00 AM - 11:00 AM">08:00 AM - 11:00 AM (Morning)</option>
              <option value="11:30 AM - 02:30 PM">11:30 AM - 02:30 PM (Midday)</option>
              <option value="04:00 PM - 07:00 PM">04:00 PM - 07:00 PM (Evening)</option>
            </select>
          </div>
          <div class="full">
            <label>Assign Pandit (Optional)</label>
            <select id="rb-pandit">
              <option value="">✨ Any Available Verified Pandit (Auto-assigned)</option>
              ${eligiblePandits.map(p => {
                const servesTag = (!district || (p.workingDistricts || []).includes(district) || p.district === district) ? `Serves ${district || p.district}` : p.district;
                return `<option value="${esc(p.email)}">Pt. ${esc(p.name)} [Specialty: ${esc(p.specialty || 'Vedic Rituals')}] (${esc(servesTag)}) — Dakshina: ${inr(p.fee)}</option>`;
              }).join('')}
            </select>
            <small class="muted" style="display:block;margin-top:3px;font-size:11px">All registered verified Pandits can perform all sacred Vedic pujas. Pandit specialty is displayed for guidance.</small>
          </div>
          <div class="full">
            <label>Ceremony Venue / Address *</label>
            <textarea id="rb-address" rows="2" placeholder="Full address / house number">${esc(district || '')}${state ? ', ' + esc(state) : ''}</textarea>
          </div>
        </div>
        <button class="btn btn-gold" id="btn-submit-rebook" style="margin-top:16px;width:100%">
          <span class="material-icons">send</span> Confirm &amp; Schedule Ceremony
        </button>
      `, (m) => {
        document.getElementById('btn-submit-rebook').onclick = async () => {
          const service = document.getElementById('rb-service').value;
          const dist = document.getElementById('rb-district').value.trim();
          const date = document.getElementById('rb-date').value;
          const time = document.getElementById('rb-time').value;

          if (!service || !dist || !date) return toast('Please fill required fields (Puja, District, Date)', true);

          try {

              method: 'POST',
              body: {
                userEmail: email,
                userName: name,
                phone: phone,
                service,
                district: dist,
                date,
                time,
                address,
                panditEmail: pEmail
              }
            });
            closeModal();
            toast(`Ceremony booked successfully! Booking ID: ${newBooking.bookingId || newBooking._id}`);
            await loadData();
            switchAdminTab('bookings');
          } catch (err) {
            toast('Booking failed: ' + err.message, true);
          }
        };
      });

    function openPanditDistrictPricingModal(id) {
      const p = S.adminPandits.find(x => x._id === id);
      if (!p) return;
      const state = p.workingState || p.state || 'Odisha';
      const districts = (p.workingDistricts && p.workingDistricts.length) ? p.workingDistricts : [p.district || 'Khordha'];
      const curPrices = p.districtPrices || {};

      openModal(`Set District Rates – ${p.name}`, `
        <div style="background:#fff8ed;border:1px solid #ebd9c2;border-radius:10px;padding:12px;margin-bottom:16px">
          <div style="font-size:14px;font-weight:700;color:var(--admin-dark)">${esc(p.name)} (${esc(state)})</div>
          <div class="muted" style="font-size:12.5px;margin-top:2px">
            Working Districts chosen by Pandit: <b>${esc(districts.join(', '))}</b>
          </div>
          <p style="margin:6px 0 0;font-size:12px;color:#8a5d3b">
            Fix the official Dakshina fee for each district served by this Pandit. Only Admin can set these amounts.
          </p>
        </div>

        <div>
          <label style="font-weight:600">Default Base Fee (₹)</label>
          <input type="number" id="adm-base-fee" value="${p.fee || 1500}" style="margin-bottom:12px">
        </div>

        <div style="display:flex;gap:8px;align-items:center;background:#f5f0e8;padding:10px;border-radius:8px;margin-bottom:14px">
          <span style="font-size:12.5px;font-weight:600;flex:1">Quick Fill All Districts:</span>
          <input type="number" id="quick-adm-dist-fee" placeholder="₹ Amount" style="width:120px;padding:5px 8px;font-size:13px">
          <button type="button" class="btn btn-outline dark btn-sm" id="btn-quick-fill-adm">Apply to All</button>
        </div>

        <label style="font-weight:600;display:block;margin-bottom:8px">District-wise Dakshina Fees (₹):</label>
        <div class="district-pricing-grid" style="display:grid;grid-template-columns:repeat(auto-fill, minmax(210px, 1fr));gap:10px;max-height:290px;overflow-y:auto;padding-right:4px">
          ${districts.map(d => {
            const hasPrice = curPrices[d] !== undefined && curPrices[d] !== null && Number(curPrices[d]) > 0;
            const currentVal = hasPrice ? Number(curPrices[d]) : 0;
            return `
              <div class="district-pricing-card" data-district="${esc(d)}" style="background:${hasPrice ? '#fff' : '#fffbfb'};border:1.5px solid ${hasPrice ? '#e0d0bc' : '#ffcdd2'};border-radius:8px;padding:8px 10px;${hasPrice ? '' : 'border-left:4px solid #d32f2f'}">
                <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px">
                  <label style="font-size:12.5px;font-weight:700;margin:0;color:var(--admin-dark)">${esc(d)}</label>
                  ${!hasPrice ? `<span class="badge dist-status-badge" style="background:#d32f2f;color:#fff;font-weight:800;font-size:9.5px;padding:2px 6px;border-radius:4px;letter-spacing:0.5px">NEW</span>` : `<span class="badge green dist-status-badge" style="font-size:9.5px;padding:2px 6px">Saved: ₹${currentVal}</span>`}
                </div>
                <div style="display:flex;align-items:center;gap:4px">
                  <span style="font-size:13px;font-weight:700">₹</span>
                  <input type="number" class="adm-dist-fee-input" data-district="${esc(d)}" value="${hasPrice ? currentVal : ''}" placeholder="00" min="0" style="font-size:13px;padding:5px 8px;font-weight:600;${hasPrice ? '' : 'border-color:#ef9a9a;background:#fff'}">
                </div>
                <div class="dist-status-note" style="font-size:10.5px;color:${hasPrice ? '#2e7d32' : '#c62828'};margin-top:4px;font-weight:700">
                  ${!hasPrice ? 'Rate: ₹00 (New District) · Please type amount to unlock region &amp; notify 404 devotees.' : `Dakshina fixed at ₹${currentVal}`}
                </div>
              </div>
            `;
          }).join('')}
        </div>

        <button class="btn btn-gold" id="btn-save-dist-prices" style="width:100%;margin-top:18px">
          <span class="material-icons">save</span> Save District Pricing
        </button>
      `, (m) => {
        // Instant visual feedback when admin types in amounts
        m.querySelectorAll('.adm-dist-fee-input').forEach(inp => {
          inp.addEventListener('input', () => {
            const val = Number(inp.value);
            const card = inp.closest('.district-pricing-card');
            const badge = card ? card.querySelector('.dist-status-badge') : null;
            const note = card ? card.querySelector('.dist-status-note') : null;
            if (val > 0) {
              inp.style.borderColor = '#81c784';
              inp.style.background = '#f1f8e9';
              if (badge) {
                badge.className = 'badge green dist-status-badge';
                badge.style.background = '#2e7d32';
                badge.style.color = '#fff';
                badge.textContent = `Set: ₹${val}`;
              }
              if (note) {
                note.style.color = '#2e7d32';
                note.textContent = `Dakshina ₹${val} typed · Ready to save, unlock region & notify 404 users.`;
              }
            } else {
              inp.style.borderColor = '#ef9a9a';
              inp.style.background = '#fff';
              if (badge && (!curPrices[inp.dataset.district] || Number(curPrices[inp.dataset.district]) <= 0)) {
                badge.className = 'badge dist-status-badge';
                badge.style.background = '#d32f2f';
                badge.style.color = '#fff';
                badge.textContent = 'NEW';
              }
              if (note && (!curPrices[inp.dataset.district] || Number(curPrices[inp.dataset.district]) <= 0)) {
                note.style.color = '#c62828';
                note.textContent = 'Rate: ₹00 (New District) · Please type amount to unlock region & notify 404 devotees.';
              }
            }
          });
        });

        const quickInput = m.querySelector('#quick-adm-dist-fee');
        const quickBtn = m.querySelector('#btn-quick-fill-adm');
        if (quickBtn && quickInput) {
          quickBtn.onclick = () => {
            const val = Number(quickInput.value);
            if (!val || val <= 0) return toast('Please enter a valid amount', true);
            m.querySelectorAll('.adm-dist-fee-input').forEach(inp => {
              inp.value = val;
              inp.dispatchEvent(new Event('input'));
            });
            toast(`Set ₹${val} for all ${districts.length} districts`);
          };
        }

        const saveBtn = m.querySelector('#btn-save-dist-prices');
        if (saveBtn) {
          saveBtn.onclick = async () => {
            const baseFee = Number(m.querySelector('#adm-base-fee').value) || 1500;
            const prices = {};
            m.querySelectorAll('.adm-dist-fee-input').forEach(inp => {
              const d = inp.dataset.district;
              const val = Number(inp.value) || 0;
              prices[d] = val;
            });

            // Optimistically update in memory immediately so UI does not hang or lag
            p.fee = baseFee;
            p.districtPrices = { ...(p.districtPrices || {}), ...prices };
            p.status = 'Verified';
            p.verified = true;
            closeModal();
            toast(`District pricing saved for ${p.name}! 404 waiting devotees notified.`);
            renderActiveTab();

            // Run backend API update and refresh in background
            api(`/pandits/${p._id}/district-prices`, {
              method: 'PUT',
              body: { fee: baseFee, districtPrices: prices }
            }).then(() => {
              loadData();
            }).catch(err => {
              toast(err.message || 'Failed saving district prices', true);
              loadData();
            });
          };
        }
      });
    }

        title: 'Reject Payment Verification',

        label: 'Rejection Reason (will be emailed to devotee)',
        placeholder: 'e.g. Invalid UTR / unconfirmed credit',
        defaultValue: defaultReason,
        confirmText: 'Reject Payment',

    async function deleteBookingPayment(bookingId) {
      const ok = await adminConfirm({
        title: 'Delete Payment Record',
        message: `Delete payment record for booking ${bookingId}?`,
        detail: 'This will permanently remove the booking and its corresponding payment verification record from the ledger. This action cannot be undone.',
        confirmText: 'Delete Payment Record',
        confirmClass: 'btn-red',
        icon: 'delete_forever'
      });
      if (!ok) return;

      try {
        await api('/bookings/' + encodeURIComponent(bookingId), { method: 'DELETE' });
        S.bookings = (S.bookings || []).filter(x => x.bookingId !== bookingId && x._id !== bookingId);
        SELECTED.payments.delete(bookingId);
        SELECTED.bookings.delete(bookingId);
        toast(`Payment record for booking ${bookingId} deleted successfully`);
        renderKpis();
        renderActiveTab();
      } catch (e) {
        toast('Error deleting payment record: ' + e.message, true);
      }
    }

    async function deleteSelectedPayments() {
      const ids = Array.from(SELECTED.payments);
      if (!ids.length) return;
      const ok = await adminConfirm({
        title: 'Bulk Delete Payment Records',
        message: `Permanently delete ${ids.length} selected payment record(s)?`,
        detail: 'All selected payment verification entries and their linked ceremony bookings will be permanently removed. This action cannot be undone.',
        confirmText: `Delete ${ids.length} Records`,
        confirmClass: 'btn-red',
        icon: 'delete_sweep'
      });
      if (!ok) return;

      try {
        const res = await api('/bookings/bulk-delete', { method: 'POST', body: { ids } });
        const idSet = new Set(ids);
        S.bookings = (S.bookings || []).filter(b => !idSet.has(b.bookingId) && !idSet.has(b._id));
        SELECTED.payments.clear();
        ids.forEach(id => SELECTED.bookings.delete(id));
        toast(`${res.count || ids.length} payment record(s) deleted successfully`);
        renderKpis();
        renderActiveTab();
      } catch (e) {
        toast('Error in bulk delete: ' + e.message, true);
      }
    }

      const pct = Math.max(0, Math.min(100, Number(val) || 0));
      const cut = Math.round(2000 * pct / 100);
      const net = Math.max(0, 2000 - cut);

          <span>Dakshina Shown to Pay Pandit:</span>
          <b style="font-size:14.5px">₹${net}</b>
        </div>
      `;
    };

    // Admin updates platform commission % once and updates all payments
    window.saveGlobalCommissionPercent = async function() {
      const input = document.getElementById('global-commission-input');
      const btn = document.getElementById('btn-save-global-commission');
      if (!input) return;
      const newPct = Math.max(0, Math.min(100, Number(input.value) || 0));

      if (btn) {
        btn.disabled = true;
        btn.innerHTML = '<span class="material-icons spin" style="font-size:16px">sync</span> Updating All Payments...';
      }

      try {
        const res = await api('/platform-commission', {
          method: 'PUT',
          body: { percent: newPct, commissionPercent: newPct }
        });
        const savedPercent = res.percent !== undefined ? res.percent : newPct;
        S.commissionPercent = savedPercent;
        toast(`Platform commission set to ${savedPercent}%! All pending puja payments updated. 🙏`);
        await loadData();
      } catch (e) {
        toast(e.message || 'Failed to update commission percentage', true);
        if (btn) {
          btn.disabled = false;
          btn.innerHTML = '<span class="material-icons" style="font-size:16px">check_circle</span> Save &amp; Apply % to All Payments';
        }
      }
    };

      const pending = eligible.filter(b => b.panditPayoutStatus !== 'Paid');
      const paid = eligible.filter(b => b.panditPayoutStatus === 'Paid');

      let list = PANDIT_PAYOUT_FILTER === 'pending' ? pending :
                 PANDIT_PAYOUT_FILTER === 'paid' ? paid : eligible;

      if (PANDIT_PAYOUT_SEARCH) {
        const q = PANDIT_PAYOUT_SEARCH.toLowerCase();
        list = list.filter(b => 
          (b.bookingId || '').toLowerCase().includes(q) ||
          (b.userName || '').toLowerCase().includes(q) ||
          (b.userEmail || '').toLowerCase().includes(q) ||
          (b.phone || '').toLowerCase().includes(q) ||
          (b.panditName || '').toLowerCase().includes(q) ||
          (b.panditEmail || '').toLowerCase().includes(q) ||
          (b.service || '').toLowerCase().includes(q)
        );
      }

      if (!list.length) {
        return toast('No records to print in the current view', true);
      }

      let totalDakshina = 0;
      let totalAdminFee = 0;
      let totalPanditPayout = 0;
      let paidCount = 0;
      let pendingCount = 0;

      const rowsHtml = list.map((b, idx) => {
        const p = (S.adminPandits || []).find(x => (x.email || '').toLowerCase() === (b.panditEmail || '').toLowerCase());
        const isPaid = b.panditPayoutStatus === 'Paid';
        if (isPaid) paidCount++; else pendingCount++;

        const mainFee = Number(b.fee) || 1500;
        const feePct = Number(b.adminFeePercent !== undefined ? b.adminFeePercent : (S.commissionPercent ?? 10));
        const adminFeeAmount = Number(b.adminFeeAmount !== undefined ? b.adminFeeAmount : Math.round((mainFee * feePct) / 100));
        const netDakshina = Number(b.panditNetPayout !== undefined && b.panditNetPayout > 0 ? b.panditNetPayout : (b.panditPayoutAmount || Math.max(0, mainFee - adminFeeAmount)));

        totalDakshina += mainFee;
        totalAdminFee += adminFeeAmount;
        totalPanditPayout += netDakshina;

        const bankDetails = p && p.bankAccount ? `
          <strong>${esc(p.bankName || 'Registered Bank')}</strong><br>
          A/C: <span style="font-family:monospace;font-weight:700">${esc(p.bankAccount)}</span><br>
          IFSC: <span style="font-family:monospace">${esc(p.ifscCode || 'N/A')}</span><br>
          Holder: ${esc(p.accountHolder || p.name)}
          ${p.upiId ? `<br>UPI: <span style="font-family:monospace">${esc(p.upiId)}</span>` : ''}
        ` : '<span style="color:#c62828;font-weight:bold">⚠️ No Bank Info Provided</span>';

        return `

              <small>District: ${esc(b.district || 'N/A')}</small>
            </td>
            <td>
              <strong>${esc(b.userName)}</strong><br>
              <small>📞 ${esc(b.phone || b.userPhone || 'N/A')}</small><br>
              <small>${esc(b.userEmail)}</small>
            </td>
            <td>
              <strong>${esc(b.panditName)}</strong><br>
              <small>📞 ${esc(p ? p.phone : 'N/A')}</small><br>
              <small>${esc(b.panditEmail)}</small><br>
              <small style="color:${p && p.verified ? '#2e7d32' : '#c62828'}">${p && p.verified ? 'Verified Purohit' : 'Pending Verification'}</small>

              ${bankDetails}
            </td>
            <td style="text-align:right;white-space:nowrap">
              <strong>₹${mainFee.toLocaleString('en-IN')}</strong><br>
              <small style="color:${b.paymentStatus === 'Paid' || b.paymentStatus === 'Paid & Verified' ? '#2e7d32' : '#c62828'}">${esc(b.paymentStatus || 'Pending')}</small>
            </td>
            <td style="text-align:right;color:#8a1f11;white-space:nowrap">

            <td style="text-align:right;color:#1b5e20;font-weight:bold;font-size:12.5px;white-space:nowrap">
              ₹${netDakshina.toLocaleString('en-IN')}
            </td>
            <td style="text-align:center;font-size:10.5px">
              ${isPaid ?
                `<span style="color:#1b5e20;font-weight:bold">PAID &amp; TRANSFERRED</span><br><code style="font-size:10px">${esc(b.panditPayoutTxnId || 'Direct')}</code>${b.panditPayoutDate ? `<br><small>${new Date(b.panditPayoutDate).toLocaleDateString('en-IN')}</small>` : ''}` :

                      <span class="muted" style="font-size:12px">UPI ID:</span>
                      <strong style="font-family:monospace;font-size:13px;color:#1b5e20">${esc(p.upiId)}</strong>
                      <button type="button" class="btn btn-outline dark btn-sm" style="margin-left:auto;padding:2px 8px;font-size:11px" onclick="navigator.clipboard.writeText('${esc(p.upiId)}');toast('UPI ID copied to clipboard!')">Copy</button>
                    </div>
                  ` : ''}
                </div>
              </div>
            ` : `
              <div style="background:#fff3e0;border:1px solid #ffb74d;border-radius:8px;padding:12px;font-size:12.5px;color:#e65100;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px">
                <div>
                  <strong>No UPI QR Code uploaded by Pandit.</strong><br>
                  <span style="font-size:12px">You can settle using Direct Bank Transfer (IMPS/NEFT)${p && p.upiId ? ` or UPI ID: <b>${esc(p.upiId)}</b>` : ''}.</span>
                </div>
                <button type="button" class="btn btn-gold btn-sm" onclick="closeModal(); openAdminPanditBankModal('${esc(p ? (p._id || p.email) : b.panditEmail)}', '${esc(b.bookingId)}');">
                  <span class="material-icons" style="font-size:14px">upload</span> Upload QR Code for Pandit
                </button>
              </div>
            `}
          </div>

          <!-- Payout Form / Transfer Parameters -->
          <div style="background:#f9f9f9;border:1px solid #e0e0e0;border-radius:10px;padding:14px;margin-bottom:16px">
            <h4 style="margin:0 0 10px;color:var(--admin-dark)">Payout Transfer Parameters</h4>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
              <div>
                <label style="font-weight:600;font-size:12.5px">Dakshina Payout Amount to Pay (₹) *</label>
                <input id="modal-pay-amount" type="number" value="${defaultAmount}" style="margin-top:4px">
                <small class="muted" style="font-size:11px">Pre-calculated Net Dakshina (${inr(mainFee)} - ${feePct}% Platform Charge)</small>
              </div>
              <div>
                <label style="font-weight:600;font-size:12.5px">Transfer Method</label>
                <select id="modal-pay-method" style="margin-top:4px">
                  <option value="UPI Transfer (QR Code)" ${defaultMethod.includes('UPI') ? 'selected' : ''}>UPI Transfer (QR Code / VPA)</option>
                  <option value="Direct Bank Transfer (IMPS/NEFT)" ${defaultMethod.includes('IMPS') ? 'selected' : ''}>Direct Bank Transfer (IMPS / NEFT)</option>
                  <option value="RTGS" ${defaultMethod.includes('RTGS') ? 'selected' : ''}>RTGS Transfer</option>
                  <option value="Cash / Handover" ${defaultMethod.includes('Cash') ? 'selected' : ''}>Cash / Handover</option>
                </select>
              </div>
              <div style="grid-column:1 / -1">
                <label style="font-weight:600;font-size:12.5px">Bank UTR / UPI Payout Transaction Reference *</label>
                <input id="modal-pay-txnid" type="text" value="${esc(defaultTxn)}" placeholder="e.g. UTR / UPI Reference Number" style="margin-top:4px;font-family:monospace">
              </div>
            </div>
          </div>

          <div style="background:#e8f5e9;border:1px solid #c8e6c9;padding:12px;border-radius:8px;margin-bottom:16px;font-size:12.5px;color:#1b5e20;line-height:1.5">
            <strong>📧 Official Email Notification to Pandit:</strong><br>
            Pressing <em>Confirm Payout &amp; Send Email</em> will immediately send an official uncompacted email to <strong>${esc(b.panditEmail)}</strong> stating:<br>
            <em>"Your net money amount [amount] (after ${feePct}% platform charge) is credited to your account number [account_number]."</em> with all ceremony, devotee and payout details.
          </div>

          <div style="display:flex;gap:10px;justify-content:flex-end">
            <button class="btn btn-outline dark" onclick="closeModal()">Cancel</button>
            <button class="btn btn-green btn-lg" id="btn-confirm-payout-go">
              <span class="material-icons">send</span> ${isResend ? 'Re-send Payout Email to Pandit' : 'Confirm Payout & Send Email to Pandit'}
            </button>
          </div>
        </div>
      `, (m) => {
        const goBtn = document.getElementById('btn-confirm-payout-go');
        if (!goBtn) return;
        goBtn.onclick = async () => {
          const amt = Number(document.getElementById('modal-pay-amount').value) || defaultAmount;
          const method = document.getElementById('modal-pay-method').value;
          const txnId = document.getElementById('modal-pay-txnid').value.trim() || defaultTxn;

          goBtn.disabled = true;
          goBtn.textContent = 'Processing Payout & Sending Email...';

          try {
            await api('/bookings/' + encodeURIComponent(b.bookingId) + '/pay-pandit', {
              method: 'POST',
              body: {
                amount: amt,
                txnId,
                method,
                adminFeePercent: feePct,
                adminFeeAmount: adminFeeAmount
              }
            });
            closeModal();
            toast(`Dakshina of ₹${amt} paid to Pandit ${b.panditName}! Confirmation email sent. 🙏`);
            loadData();
          } catch (e) {
            toast(e.message || 'Failed to process payout', true);
            goBtn.disabled = false;
            goBtn.innerHTML = '<span class="material-icons">send</span> Confirm Payout & Send Email to Pandit';
          }
        };
      });
    }

    // Admin opens Pandit Bank & QR Modal
    window.handleAdminPanditQrUpload = function(input) {
      if (!input.files || !input.files[0]) return;
      const file = input.files[0];
      if (file.size > 3 * 1024 * 1024) {
        toast('Please upload an image smaller than 3MB.', true);
        return;
      }
      const reader = new FileReader();
      reader.onload = function(e) {
        const dataUrl = e.target.result;
        const urlInput = document.getElementById('adm-p-qr');
        if (urlInput) urlInput.value = dataUrl;
        window.updateAdminPanditQrPreview(dataUrl);
      };
      reader.readAsDataURL(file);
    };

    window.updateAdminPanditQrPreview = function(url) {
      const box = document.getElementById('adm-p-qr-preview-box');
      const img = document.getElementById('adm-p-qr-preview-img');
      if (!url || !url.trim()) {
        if (box) box.style.display = 'none';
      } else {
        if (img) img.src = url.trim();
        if (box) box.style.display = 'block';
      }
    };

    function openAdminPanditBankModal(idOrEmail, returnBookingId) {
      let p = (S.adminPandits || []).find(x => x._id === idOrEmail || (x.email || '').toLowerCase() === String(idOrEmail || '').toLowerCase());
      if (!p) {
        p = { _id: idOrEmail, email: idOrEmail, name: 'Assigned Pandit', bankAccount: '', ifscCode: '', bankName: '', accountHolder: '', upiId: '', qrCode: '' };
      }

      openModal(`Pandit Bank & Payout Details – ${p.name}`, `
        <div style="font-size:13.5px;color:#3b2115">
          <p class="muted" style="margin-top:0">Configure direct bank &amp; UPI QR payout account for <strong>${esc(p.name)}</strong> (${esc(p.email)}):</p>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:18px">
            <div>
              <label style="font-weight:600;font-size:12.5px;display:block;margin-bottom:4px">Account Holder Name *</label>
              <input type="text" id="adm-p-holder" value="${esc(p.accountHolder || p.name || '')}" placeholder="Full name on passbook">
            </div>
            <div>
              <label style="font-weight:600;font-size:12.5px;display:block;margin-bottom:4px">Bank Name *</label>
              <input type="text" id="adm-p-bank" value="${esc(p.bankName || '')}" placeholder="e.g. State Bank of India, HDFC">
            </div>
            <div>
              <label style="font-weight:600;font-size:12.5px;display:block;margin-bottom:4px">Bank Account Number *</label>
              <input type="text" id="adm-p-acc" value="${esc(p.bankAccount || '')}" placeholder="Full account number" style="font-family:monospace">
            </div>
            <div>
              <label style="font-weight:600;font-size:12.5px;display:block;margin-bottom:4px">Bank IFSC Code *</label>
              <input type="text" id="adm-p-ifsc" value="${esc(p.ifscCode || '')}" placeholder="e.g. SBIN0001234" style="font-family:monospace;text-transform:uppercase">
            </div>
            <div style="grid-column:1 / -1">
              <label style="font-weight:600;font-size:12.5px;display:block;margin-bottom:4px">UPI ID (Optional)</label>
              <input type="text" id="adm-p-upi" value="${esc(p.upiId || '')}" placeholder="e.g. name@okhdfcbank">
            </div>

            <!-- Upload QR Code for Pandit (Optional) -->
            <div style="grid-column:1 / -1">
              <label style="font-weight:600;font-size:12.5px;display:flex;align-items:center;gap:6px;margin-bottom:4px">
                <span class="material-icons" style="font-size:16px;color:var(--admin-gold)">qr_code_scanner</span>
                Pandit UPI QR Code (Optional – PhonePe / GPay / Paytm / BHIM)
              </label>
              <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
                <input type="file" id="adm-p-qr-file" accept="image/*" style="font-size:12px" onchange="handleAdminPanditQrUpload(this)">
                <span class="muted" style="font-size:12px">OR URL:</span>
                <input type="text" id="adm-p-qr" value="${esc(p.qrCode || '')}" placeholder="https://... or uploaded image data" style="flex:1;min-width:200px" oninput="updateAdminPanditQrPreview(this.value)">
              </div>
              <div id="adm-p-qr-preview-box" style="margin-top:10px;${p.qrCode ? '' : 'display:none;'}">
                <div style="display:inline-flex;align-items:center;gap:12px;background:#fff;border:1.5px solid #ebd9c2;border-radius:8px;padding:8px 12px">
                  <img id="adm-p-qr-preview-img" src="${esc(p.qrCode || '')}" style="width:72px;height:72px;object-fit:contain;border:1px solid #ddd;border-radius:4px" alt="QR Preview">
                  <div>
                    <span class="badge green" style="font-size:11px">QR Attached</span>
                    <button type="button" class="btn btn-outline red btn-sm" style="margin-top:4px;display:block;font-size:11px;padding:2px 8px" onclick="document.getElementById('adm-p-qr').value='';updateAdminPanditQrPreview('');">Remove QR</button>
                  </div>
                </div>
              </div>
            </div>
          </div>
          <button class="btn btn-gold btn-lg" id="btn-save-admin-p-bank" style="width:100%">
            <span class="material-icons">save</span> Save Bank &amp; Payout Details
          </button>
        </div>
      `, (m) => {
        const saveBtn = document.getElementById('btn-save-admin-p-bank');
        if (!saveBtn) return;
        saveBtn.onclick = async () => {
          const acc = document.getElementById('adm-p-acc').value.replace(/[\s-]/g, '').trim();
          const ifsc = document.getElementById('adm-p-ifsc').value.replace(/[\s-]/g, '').trim().toUpperCase();
          const bankName = document.getElementById('adm-p-bank').value.trim();
          const holder = document.getElementById('adm-p-holder').value.trim() || p.name;
          const upi = document.getElementById('adm-p-upi').value.trim();
          const qr = document.getElementById('adm-p-qr') ? document.getElementById('adm-p-qr').value.trim() : (p.qrCode || '');

          if (!acc) return toast('Bank Account Number is required', true);
          if (!ifsc) return toast('Bank IFSC Code is required', true);

          saveBtn.disabled = true;
          saveBtn.innerHTML = '<span class="material-icons spin">sync</span> Saving...';

          try {
            const pId = p._id ? encodeURIComponent(p._id) : encodeURIComponent(p.email);
            await api('/pandits/' + pId + '/bank-details', {
              method: 'PUT',
              body: {
                email: p.email,
                bankAccount: acc,
                ifscCode: ifsc,
                bankName,
                accountHolder: holder,
                upiId: upi,
                qrCode: qr
              }
            });
            closeModal();
            toast(`Bank & Payout Details saved for Pandit ${p.name}! 🙏`);
            await loadData();
            if (returnBookingId) {
              openPanditPayModal(returnBookingId);
            }
          } catch (e) {
            toast(e.message || 'Failed to save bank details', true);
            saveBtn.disabled = false;
            saveBtn.innerHTML = '<span class="material-icons">save</span> Save Bank &amp; Payout Details';
          }
        };
      });
    }

    (async function init() {
      try {
        const r = await api('/auth/admin-direct', { method: 'POST' });
        if (r && r.token) {
          TOKEN = r.token;
          localStorage.setItem('admin_token', r.token);
          localStorage.setItem('pc_admin_token', r.token);
          toast('Super Admin Access Granted 🛡️');
        }
      } catch (e) {
        console.warn('Direct admin auth notice:', e.message);
      }
      document.getElementById('btn-refresh-db').onclick = () => loadData();
      await loadData();
    })();
  </script>
</body>
</html>
